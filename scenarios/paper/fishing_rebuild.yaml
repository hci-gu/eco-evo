# Optimised fishing: 5 years at r x today's effort (rebuilding), then
# k x today's effort for the following 95 years. Every (r, k) pair.
# k = 1, r = 1 is today's fishing; compare cumulative catch over 100 years
# with fishing_constant.yaml at the same k.
description: Five rebuilding years at r x today's effort, then 95 years at k x today's effort.
base: ../../mareld2.yaml
run_name: 2026-11-17_1
years: 100
seeds: [0, 1, 2]
warmup_scale: {fishing: 1.0}
schedule:
  - {from_year: 0, scale: {fishing: 0.0}}
  - {from_year: 5, scale: {fishing: 1.0}}
sweep:
  - name: r
    values: [0.0, 0.25, 0.5]
    set: [schedule.0.scale.fishing]
  - name: k
    values: [0.5, 0.75, 1.0, 1.5, 2.0, 3.0, 4.0]
    set: [schedule.1.scale.fishing]
