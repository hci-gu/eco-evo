  # Bottom otter trawling on the benthos (section 161): direct seabed
  # mortality, loss per tick = d x SAR / 1460 with the effort map in
  # MW-h/km2/year. SAR (whole gear footprint, ICES "surface") per unit
  # effort k = 0.75 /yr (range 0.6-1.1; ICES WGSFD SAR per MW-h/km2 where
  # otter trawls dominate, 2019-2024, matching the 2021-2024 level of the
  # map; Eigaard et al. 2016 gear widths give 0.9-1.1 for 300-500 kW
  # shrimp/Nephrops trawlers). d = 0.10 per pass (range 0.06-0.115;
  # Rijnsdorp et al. 2020 OT_CRU, from Hiddink et al. 2017's otter-trawl
  # 0.06 scaled by the digging share; Pitcher et al. 2022 mud 0.115).
  # Slope d k / 1460 = 5.137e-5 per tick per unit; the grid mean (3.0)
  # is SAR 2.3, a loss of 0.23 /yr. Only the biomass factor acts on a
  # non decision maker. research_notes/Bottentralning och bentos/.
  benthic_community_impacted_by_bottom_trawling:
    impact_affects: true
    impact_table:
      - value: 0.0
