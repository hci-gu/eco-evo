  # Fishing (section 161). The impact value is fishing effort density in
  # MW-h per km2 per year (EMODnet, VMS vessels > 12 m; maps from
  # tools/make_fishing_maps.py). The table is linear, biomass_factor =
  # q * effort per tick, with the catchability q set so that the mean
  # effort of today's map gives today's biomass-weighted fishing
  # mortality: F 0.10 /yr for pelagic fish (ICES 2026: NSAS, WBSS,
  # sprat, mackerel, horse mackerel, sandeel pooled by Skagerrak biomass;
  # reports/Fiskeridodlighet i Skagerrak idag.md). Each group's F is
  # split over the two gear maps by the gear that catches it (ICES catch
  # by fleet, STECF FDI 3.a.20; research_notes/Fiskeridodlighet i
  # Skagerrak idag/catch_by_gear.md): pelagic fish 98 % pelagic trawls
  # and seines, 2 % bottom trawls (herring bycatch, range 0.2-11 %).
  # Mean effort 0.02496 -> q = 0.98 x 0.10 / 1460 / 0.02496 = 2.689e-3
  # per tick per unit. The last row lies far above today's maximum (0.43)
  # so scenario maps with more effort are not clamped. Was a placeholder
  # (1.0 per tick at 1000).
  planktivorous_fish_impacted_by_pelagic_trawling:
    impact_affects: true
    impact_table:
      - value: 0.0
        biomass_factor: 0.0
        energy_factor: 0.0
      - value: 10.0
        biomass_factor: 0.0268900569
        energy_factor: 0.0
