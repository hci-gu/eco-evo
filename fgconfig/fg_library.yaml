species_definitions:
  phytoplankton:
    current_response: 1.0
    display_name: "Phytoplankton"
    is_decision_maker: false
    movement_speed: 0.0
    # growth_rate is DERIVED by lib/world/growth_budget.py and recomputed
    # by the loader for every run; the number stored here is what the
    # loader computes for mareld2.yaml (seabirds muted) with
    # --mortality on; with --mortality off the loader leaves M1 out. Edit
    # r_max, natural_mortality or the predation matrix, not this value.
    # NDM: g = (r_max + checked predation_mortality on this FG) / 1460.
    # The logistic r is the growth at LOW density, net of the losses the
    # model does not resolve (section 131). Highest in situ growth from
    # dilution experiments, 0.67 d-1 (Stelfox-Widdicombe et al. 2004,
    # southern North Sea, April, 7-9.5 C), minus microzooplankton grazing
    # (60 %, Calbet & Landry 2004) = 0.27 d-1 = 0.067 /tick = 97.8 /yr;
    # the zooplankton pair supplies 22.63 of it, so r_max = 75.2 /yr.
    # Sinking and lysis are not subtracted (would give ~0.055 /tick).
    # The annual-mean value of section 129 (0.0194, r_max 5.66) was a
    # steady-state remainder, the error already corrected for benthos.
    # Derivation: reports/Litteraturbaserad growth rate per FG.md.
    # Section 173: that rate is gross of sinking, which is now the
    # explicit M1 below, so r_max = 97.8 - 22.63 - 7.32 = 67.882 and
    # growth_rate stays 0.0670 (was r_max 75.2 with no M1).
    r_max: 67.882
    growth_rate: 0.16748651
    # Own loss M1 (section 173): the sinking loss, 0.005 /tick = 0.02 /d
    # = 7.32 /yr. The dilution rate behind growth_rate (Stelfox-
    # Widdicombe et al. 2004 [F]) is net of respiration and lysis and
    # gross of sinking (closed bottles, no nutrients added); sinking of
    # growing cells over a 6-17 m mixed layer is 0.03 /d (0.01-0.1),
    # research_notes/Naringspool for vaxtplankton/phytoplankton_losses.md.
    # 0.005 fitted to SHARK A17 chl and nitrate with fix58 frozen (Mar
    # bloom, 4.6x); 0.0075 gives 17x and kills the frozen zooplankton.
    # Acts with or without the nutrient pool.
    natural_mortality: 0.005
    max_carrying_capacity: 24.0
    # 4.8 kJ/g WW, the Ecopath convention, for a flagellate-rich coastal
    # assemblage (flagellates 6-8 kJ/g WW). The previous 2.0 implies C/WW
    # ~0.04, i.e. large diatoms only, and left zooplankton unable to close
    # its energy budget (section 133, reports/Zooplankton energibudget.md).
    energy_content: 4800.0
    # seed_rate 0 is a DELIBERATE choice (2026-09-28), not editor drift:
    # phytoplankton has no recolonisation floor, so a cell that reaches
    # exact zero stays there. Sections 69.6 and 73.4 argue for 1e-07 and
    # 74.11 records the value being reset to 0 twice by the FG editor,
    # which rewrites this file without its comments. This block is
    # therefore the evidence that the zero was chosen: if it disappears,
    # the value came from the editor and not from a decision.
    seed_rate: 0.0
    # Light-limited growth on the daylight calendar (section 138): the
    # growth rate above is the April rate (section 131), so the factor is
    # 1 on day 105 and follows P-I = tanh(I/I_k) over the mixed layer
    # otherwise. I_k = Pmax/alpha, monthly medians of the SMHI 14C P-I
    # curves 2008-2021 (Anholt E, Kattegat, 0-10 m; Dec, n = 6, replaced
    # by the mean of Nov and Jan): photoacclimation from ~110 in winter
    # to ~300 in July.
    light_saturation: [114, 132, 161, 165, 208, 248, 298, 257, 193, 149, 111, 
          113]
    light_reference_day: 105
    # Nutrient pool (section 172, lib/world/nutrients.py). Used when the
    # project enables simulation_settings.nutrients (mareld2.yaml does
    # since section 174); then growth is
    # r L(t) B N/(N + k_N Y M(t)), paid out of the pool. K above is then
    # only a ceiling, kept because without an own loss term the stock has
    # no way down; it is not calibrated for this use and blocks uptake
    # in an ungrazed world. Sources: research_notes/Naringspool for
    # vaxtplankton/nutrient_parameters.md (Swedish dir name).
    # k_N 0.5 umol N/l: ONE pool for nitrate and the regenerated ammonium
    # (NH4 half-saturation 0.1-0.5; nitrate ~1.0 in nutrient-rich water,
    # MacIsaac & Dugdale 1972 [F]; NPZ standard 0.5, Fennel et al. 2006
    # [F]); 0.5 fitted the A17 nitrate best once grazing regenerates
    # (section 177). Was 1.0.
    # Yield: 1 umol N/l over 1 m = 14 mg N/m2 x Redfield C:N 5.68 g/g =
    # 79.5 mg C/m2, / C:WW 0.10 (North Sea Ecopath 1:10, Mackinson &
    # Daskalov 2007 [F]; the ratio energy_content 4.8 kJ/g WW implies) =
    # 0.795 t/km2. Regeneration 0.3 (range 0.25-0.45): Acartia excretes
    # ~0.25 of ingested N (Kioerboe et al. 1985 via Kuijper et al. 2004
    # [F]); faecal pellets leave a 6-17 m mixed layer and count as export.
    nutrient_half_saturation: 0.5
    nutrient_yield: 0.795
    grazing_regeneration: 0.3
    spawn:
      mode: perlin
      scale: 12.0
      octaves: 4
      persistence: 0.5
      lacunarity: 2.0
      threshold: 0.0
      min_frac_of_max: 0.1
  subsurface_phytoplankton:
    # Section 180: the subsurface chlorophyll maximum. SHARK A17 2010-2023
    # (bottle chl-a by depth): from April to August chl at 15-30 m is
    # 2-4x the surface (Jun 2.06 ug/l at 20 m vs 0.68 at 1 m, Jul 1.59 at
    # 30 m vs 0.38) and ~90 % of the 0-30 m chlorophyll lies below the
    # 6 m mixed layer, on the nitracline (NO3 0.1 at 15 m, 2.6-4.0 at
    # 30 m). The single mixed layer had none of it: gross PP 13-15 g
    # C/m2/yr against 190-290 in the Kattegat/Gullmar Fjord 14C record.
    # The same algae as phytoplankton (same r_max, M1, grazing pairs,
    # hence the same derived gross growth_rate), living in the layer
    # between the mixed layer and the manifest's
    # nutrients.subsurface_layer.bottom_m: light through the mixed layer
    # then the layer's own attenuation, nutrients from the reservoir
    # below, entrained into the mixed layer when it deepens. The growth
    # budget comments of phytoplankton apply unchanged.
    current_response: 1.0
    display_name: "Subsurface phytoplankton"
    is_decision_maker: false
    movement_speed: 0.0
    water_layer: subsurface
    r_max: 67.882
    growth_rate: 0.16748651
    natural_mortality: 0.005
    max_carrying_capacity: 24.0
    energy_content: 4800.0
    seed_rate: 0.0
    # Shade-adapted: I_k 30 umol photons/m2/s [D] (the light factor is
    # normalised by this I_k in the mixed layer on day 105, so
    # growth_rate keeps its meaning). 30 fitted A17 nitrate and the
    # column chlorophyll best of 30/50 in the scratch calibration
    # (resume 180) and is BELOW the regional measurements: Kattegat
    # pycnocline I_k 63-117, mean 92 (Lyngsgaard et al. 2014 [F]); NE
    # North Sea SCM ~64-86 [D from Bendtsen & Richardson 2018 F]; only
    # the Celtic Sea scatter reaches 20-100 (Hickman et al. 2012 [F]).
    # research_notes/Djupklorofyllmaximum (resume 181.8).
    light_saturation: 30.0
    light_reference_day: 105
    nutrient_half_saturation: 0.5
    nutrient_yield: 0.795
    grazing_regeneration: 0.3
    # Spawned on the phytoplankton's layout: the same water masses, and
    # an independent field would put the zooplankton between its two
    # algal prey at the start.
    spawn:
      mode: env_driven
      floor: 0.0
      noise_amp: 0.0
      noise_scale: 4.0
      min_frac_of_max: 0.1
      refs:
        - name: phytoplankton
          weight: 1.0
          transform: linear
  zooplankton:
    display_name: "Zooplankton"
    # Display only (live viewer hover): the taxa the comments below
    # calibrate against (copepods, Calanus and Metridia from the
    # Norwegian Trench, krill).
    member_species:
      - {name: "copepods (Calanus, Metridia, small species)"}
      - {name: krill}
    is_decision_maker: true
    maintenance_level: 0.5
    max_energy_reserve: 675.0
    resting_metabolism: 22.5
    # Water temperature (section 143; only with the manifest's
    # simulation_settings.temperature): Q10 2.0 for active copepods and
    # krill, 4-16 C (Ikeda et al. 2001; Saborowski et al. 2000, Kattegat
    # Meganyctiphanes). resting_metabolism is read as the annual mean.
    # Calanus diapause (~10-20 % of active respiration) is a state switch
    # a Q10 does not describe.
    metabolism_q10: 2.0
    metabolism_t_ref: annual_mean
    # Section 181: Q10 on the whole intake (attack rate and ceiling
    # together; annual mean 1, so a and h stay annual means). 2.8 =
    # copepod feeding/growth (Hansen, Bjornsen & Hansen 1997, used by
    # Kioerboe & Hirst 2014 [F]; Huntley & Lopez 1992 growth 3.0 [S]);
    # models use 2.0-2.14 (ERSEM, NEMURO, PISCES [SRC]), in situ
    # fecundity 1.4-1.6 (Hirst & Bunker 2003 [A]). 2.8 [D] was fitted to A17's
    # Feb-Mar TOTAL zooplankton (0.5 / 4.6 vs 0.7 / 4.3 t/km2; 2.0 gave
    # 1.0 / 9.8), but 64-75 % of that carbon is Calanus and Metridia
    # risen from the Norwegian Trench (section 183); the target is now the
    # resident stock (Feb / Mar 0.2 / 1.6), reached with growth_q10 below.
    # 2.8 vs 2.0 is open. research_notes/Zooplankton vinterdodlighet/
    # zoo_autumn_closure.md and winter_stock.md (Swedish dir name).
    ingestion_q10: 2.8
    # Section 183: Q10 on the growth branch (reserve -> biomass; annual
    # mean 1, starvation unscaled). 3.0 = copepod growth vs temperature,
    # g = 0.0445 e^(0.111 T) (Huntley & Lopez 1992 [S]); not fitted. At
    # 5 C in February it caps growth near their ~8 %/d where the flat
    # rate gave 13 %/d, and puts the spring at the resident stock
    # (Mar 1.7 vs 1.6 t/km2, peak in May).
    growth_q10: 3.0
    movement_speed: 0.02
    # Respiration + excretion while feeding, in multiples of the resting
    # (fasting) rate (section 135): Kiorboe et al. 1985 measured both at
    # "more than 4 times" those of starved Acartia tonsa. The model has no
    # excretion term (ammonium, DOC), so that loss belongs here. Section
    # 124 used the respiration-only ratio, 1.6-2.5 (Thor 2000, Svetlichny
    # 2022, Koski 2017) -> 2.0. Cross-check, not the basis: the steady-
    # state gross growth efficiency is now ~0.29-0.31 (Straile 1997: mean
    # 0.26, IQR 0.13-0.35), against ~0.40 at 2.0. Kiorboe 2018's mf/m0 =
    # 6.7 also counts defecation, already in 1 - assimilation, so it is not
    # used as an upper bound.
    feeding_cost: 4.0
    movement_cost: 1.2
    energy_content: 4500.0
    min_split_biomass: 0.0
    # growth_rate is DERIVED by lib/world/growth_budget.py and recomputed
    # by the loader for every run; the number stored here is what the
    # loader computes for mareld2.yaml (seabirds muted) with
    # --mortality on; with --mortality off the loader leaves M1 out. Edit
    # r_max, natural_mortality or the predation matrix, not this value.
    # DM: g = (r_max + M1 + checked predation_mortality) /
    #         ((1 - maintenance_level) x 1460).
    # r_max 33.4 /yr = food-unlimited copepod production, 0.16 d-1 at
    # 11.5 C (Huntley & Lopez 1992) = 58.4 /yr, minus total mortality
    # 25 /yr. Replaces the unsourced 15-40 /yr band of section 111.
    r_max: 33.4
    growth_rate: 0.1185401
    # M1 = total copepod mortality (~25 /yr = realised P/B) minus the
    # fish predation booked on pairs. Section 209: planktivorous_fish 1.6
    # + predatory_fish 0.13 = 1.73 /yr (was 5.3, the Ecopath 21 % of pelagic
    # fish, gadoids and seabirds), so M1 = 23.27 /yr and g is unchanged.
    # The rest is carnivorous zooplankton, fish larvae, jellyfish and
    # non-predation losses.
    natural_mortality: 0.015812
    # Section 202: half of the M1 loss is remineralised in the water
    # column and returns to the nutrient pools (ERSEM pe_R1 0.5, resume
    # 179.2), split between the layers by where the zooplankton fed.
    mortality_regeneration: 0.5
    max_intake_rate: 0.25
    spawn:
      mode: env_driven
      floor: 0.0
      noise_amp: 0.0
      noise_scale: 4.0
      min_frac_of_max: 0.1
      refs:
        - name: phytoplankton
          weight: 1.0
          transform: linear
    starve_rate: 0.2
    visibility_floor: 0.2
    interference: 0.0
    extinction_threshold_factor: 0.5
    current_response: 1.0
  microzooplankton:
    # Section 177: ciliates + heterotrophic dinoflagellates (HD-dominated
    # here), the grazers section 131 used to subtract from the
    # phytoplankton's growth as "60 % microzooplankton grazing". A non
    # decision maker that GRAZES (interactions.build_ndm_grazing): no
    # logistic growth of its own (growth_rate 0), it grows by
    # growth_efficiency x what it takes. Sources: research_notes/
    # Mikrozooplankton/microzooplankton.md (Swedish dir name).
    current_response: 1.0
    display_name: "Microzooplankton"
    # Display only (live viewer hover): the taxa of section 177.
    member_species:
      - {name: ciliates}
      - {name: heterotrophic dinoflagellates}
    is_decision_maker: false
    movement_speed: 0.0
    growth_rate: 0.0
    max_carrying_capacity: 100.0
    # Protist carbon ~45 kJ/g C at C:WW 0.1 (NK94 0.11 pg C/um3).
    energy_content: 4500.0
    # GGE 0.3 on carbon (Straile 1997 [F]: ciliates 30 %, dinoflagellates
    # 26 %).
    growth_efficiency: 0.3
    # NH4 excreted ~0.4 of ingested N (Verity 1985 [F] 53 %, Goldman et
    # al. 15-50 % [A]): 0.4 / (1 - 0.3) = 0.571 of the part not grown.
    excretion_regeneration: 0.571
    # Q10 2.6 (Nielsen & Kioerboe 1994 [F]; Hansen 1997 2.8 [F]) on the
    # 10 C rates of the grazing pair; layer in the manifest.
    grazing_q10: 2.6
    grazing_t_ref: 10.0
    # Non-predatory mortality 0.05 /d with copepod predation explicit
    # (ERSEM basal 0.05 [F]; range 0.02-0.1).
    natural_mortality: 0.0125
    # Section 202: half of the M1 back to the pools (as zooplankton), and
    # all of the egesta - (1 - 0.3) x (1 - 0.571) = 0.30 of the intake -
    # to the grazed producer's pool beside the excretion (0.40).
    mortality_regeneration: 0.5
    egestion_regeneration: 1.0
    min_split_biomass: 0.0
    extinction_threshold_factor: 0.0
    seed_rate: 0.0
    spawn:
      mode: env_driven
      floor: 0.0
      noise_amp: 0.0
      noise_scale: 4.0
      min_frac_of_max: 0.1
      refs:
        - name: phytoplankton
          weight: 1.0
          transform: linear
  benthic_infauna:
    current_response: 0.0
    display_name: "Benthic Infauna"
    # Section 221: the INFAUNA only (id benthic_community before the
    # split; the mobile epifauna is its own group, mobile_epifauna, below). Display
    # only (live viewer hover): ordered by the benthivores' infauna diet
    # (ICES stomach database, consumption-weighted): polychaetes 0.49,
    # brittle stars 0.30, bivalves 0.09, other echinoderms 0.04, other
    # small crustaceans 0.03, other molluscs 0.03, amphipods 0.01 (shares
    # of what is eaten, not of the standing stock). research_notes/"Infauna och rorlig epifauna" (Swedish letters)/params_split.md.
    member_species:
      - {name: polychaetes}
      - {name: brittle stars and other echinoderms}
      - {name: bivalves and other molluscs}
      - {name: amphipods and other small crustaceans}
    is_decision_maker: false
    movement_speed: 0.0
    # Section 221: growth is DERIVED (as every NDM with r_max): g = (r_max +
    # sum checked M2)/1460. r_max 1.0 /yr (0.8-1.5): short-lived
    # polychaetes and small bivalves at 300 m (Hiddink et al. 2019 r 2.41 /
    # 1.24 / 0.34 for 1-3 / 3-10 / > 10 yr longevity) and Amphiura arms at
    # 100 m (section 207). Was a hand-set 0.971 for infauna + epifauna.
    # The stored growth_rate is what the loader derives (habitat.build
    # reads it before the derivation, so keep it in sync).
    r_max: 1.0
    growth_rate: 0.00071205479452
    # Section 223.12: refuge with exchange (lib/environments/ecosystem_env/
    # refuge.py). exposed_share: the part within the fish's reach at
    # equilibrium, 0.20 (0.08-0.45; Dauwe et al. 1998, Skagerrak 280 m:
    # 27 % of the biomass in the top 0-2 cm; Amphiura arm tips); the rest
    # is deep-burrowing animals and tissue out of reach. Exchange k 2.5 /yr
    # (1.5-3.0): regrowth of cropped arm tips and siphons (~146 d to refill
    # the exposed layer; Skold & Gunnarsson 1996, Dupont & Thorndyke 2006)
    # and settlers growing out of reach; k_in = phi k ~0.5 /yr (lugworm
    # tails cropped at 0.39 /yr, Beukema & de Vlas 1979). Per 6 h tick:
    # 2.5 / 1460. research_notes/"Refugium och utbyte i bentos" (Swedish
    # letters).
    exposed_share: 0.2
    refuge_exchange_rate: 0.0017123288
    # Section 207: K per cell from the manifest's depth map, t WW/km2,
    # linear in depth between the rows and held outside them. Today's
    # prey-sized infauna at Josefson's (1990) in-grid stations, 100 m
    # ~105-200 g WW/m2 (without large species) and 300 m ~50-85, taken in
    # the lower half: B* 110 / 55. Section 221: over the infauna's own
    # equilibrium share 1 - (F + M2)/(r_max + M2) = 0.840 (trawl kill
    # 0.136 /yr, benthivore M2 0.029): K 131.0 / 65.5 (was 164.5 / 81.0
    # for infauna + epifauna). Section 223.9: benthivore M2 0.0396, share
    # 0.831; rows refitted by least squares to keep today's start map
    # B*(c): 132.35 / 66.17.
    capacity_depth_table:
      - depth_m: 100.0
        capacity: 132.35
      - depth_m: 300.0
        capacity: 66.17
    # Fallback without a depth map: the box mean of the table.
    max_carrying_capacity: 111.1
    # Section 221: energy as eaten 2.6 kJ/g WW (1.7-3.6): AFDW/WW
    # (Ricciardi & Bourget 1998) x kJ/g AFDW (Steimle & Terranova 1985),
    # shells included, weighted by the fish intake (brittle stars and
    # bivalves are mostly ash). Was 3000 for the pooled community.
    energy_content: 2600.0
    # Section 207: start at today's equilibrium per cell, K(c) (1 - (F(c)
    # + M2)/r) with F(c) from the bottom-trawl baseline map (lib/world/
    # habitat.py); the total comes from the manifest.
    spawn:
      mode: equilibrium
    seed_rate: 1e-06
  mobile_epifauna:
    current_response: 0.0
    display_name: "Mobile Epifauna"
    # Section 223.12 decision (E1): the EXPOSED mobile epifauna only; Nephrops
    # is its own group, norway_lobster, below (no exchange between them: no
    # biological process turns burrowed Nephrops into crabs or shrimp; every
    # measured epifauna exchange is diel). Members by share of today's stock
    # (section 221 convention applied to the 223.10 ration, user's choice
    # 223.14): crabs, hermit crabs and Munida 2.45 t/km2 (raised by mass
    # balance of the fish's crab consumption 1.23 + catch at P/B 0.7),
    # northern shrimp 0.56 (SS3 strata), small shrimps and mysids 0.545
    # (mass balance at P/B 1.95), cephalopods and small demersal fish 0.23
    # (M&D 2007 North Sea values 0.08 and 0.34 + 0.045); grid mean 3.78
    # t/km2. Fish take 72 % of the crabs' production (bound 60-92 %).
    # The 223.10 redistribution (cephalopods, krill/hyperbenthos, small
    # demersal fish, the epifauna slices of unidentified fish and carrion;
    # 0.096 of the benthivores' consumption, 0.66 t/km2/yr) is booked on
    # this group: a member of its own, B = flow / (EE 0.9 x P/B) at Mackinson & Daskalov 2007 P/B.
    # research_notes/"Havskrafta och exponerad epifauna" (Swedish letters); research_notes/"Refugium och utbyte i bentos" (Swedish letters).
    member_species:
      - {name: "crabs, hermit crabs and squat lobsters", share: 0.65}
      - {name: northern shrimp, share: 0.15}
      - {name: small shrimps, share: 0.09}
      - {name: mysids, share: 0.06}
      - {name: cephalopods and small demersal fish, share: 0.06}
    is_decision_maker: false
    movement_speed: 0.0
    # Derived growth g = (r_max + sum M2)/1460. r_max 1.14 /yr (0.9-1.3): the
    # stock-weighted taxon r_max (crabs 0.9, northern shrimp 1.2, small
    # shrimps and mysids 1.86; section 221 and the refuge note); the one
    # logistic matching the sum of the taxon K would be 1.05 (J). r_gross
    # 1.76 /yr against a stock-weighted literature P/B ~1.08: the M2 of the
    # booked prey (open flag).
    r_max: 1.14
    growth_rate: 0.0011979452055
    # K = today's stock / equilibrium share 0.543 (trawl 0.186, M2 0.616),
    # rows fitted by non-negative least squares so the start map B*(c)
    # matches the members' depth structure (crabs 2:1 from 100 to 300 m,
    # northern shrimp peaking at 200-300 m, small shrimps and mysids flat)
    # under the effort map, total kept; rms 8 % of the mean.
    # Section 223.26: rows x0.9960 so the equilibrium start total is kept
    # (the water-column predators' M2 0.007 is unchecked since the split).
    capacity_depth_table:
      - depth_m: 81.0
        capacity: 6.76
      - depth_m: 123.0
        capacity: 6.30
      - depth_m: 173.0
        capacity: 6.39
      - depth_m: 221.0
        capacity: 10.67
      - depth_m: 272.0
        capacity: 8.55
      - depth_m: 387.0
        capacity: 4.69
    max_carrying_capacity: 7.1
    # 3.75 kJ/g WW as eaten (3.1-4.7; crustaceans with their shell; Lawson
    # et al. 1998 for northern shrimp); 3.74 recomputed on the E1 intake
    # weights without Nephrops, 3.77 with the booked prey (J energies).
    energy_content: 3750.0
    spawn:
      mode: equilibrium
    seed_rate: 1e-06
  norway_lobster:
    current_response: 0.0
    display_name: "Norway Lobster"
    # Section 223.12 decision (E1): Nephrops norvegicus, split out of
    # mobile_epifauna. 4.57 t/km2 grid mean: ICES UWTV 2024 stratum
    # burrow densities (FU 3-4; 0.26 / 0.09 / 0.55 per m2, one animal per
    # burrow) x 30 g per animal on
    # the per-cell survey (mud) share; flat to ~250 m, ~0 below 300 m. In
    # burrows ~93 % of the time (0.06-0.12 visible per burrow at peak
    # emergence, Aguzzi et al. 2021); berried females stay in for 7-10
    # months. 1.5 % of the benthivores' consumption (cod 4.6 % of its
    # intake; section 223.15, research_notes/"Havskrafta i fiskdieter"
    # (Swedish letters)); traces in whiting (<= 0.55 %), none in saithe.
    # research_notes/"Havskrafta och exponerad epifauna" (Swedish letters).
    member_species:
      - {name: Norway lobster, share: 1.0}
    is_decision_maker: false
    movement_speed: 0.0
    # Derived growth g = (r_max + sum M2)/1460. r_max 0.34 /yr (0.25-0.5):
    # lifespan > 10 yr (Hiddink et al. 2019 longevity class r 0.34), M
    # 0.2-0.3, Ecopath P/B 0.35-0.4 (Mackinson & Daskalov 2007).
    r_max: 0.34
    growth_rate: 0.00024828767123
    # K = today's stock / equilibrium share 0.697 (trawl 0.0874, M2 0.0225),
    # non-negative least squares per depth row, total kept; the table ends
    # at 300 m (held below it), where the UWTV grounds end. Depth cannot
    # hold the mud patches (23 % of the cells have no Nephrops ground):
    # rms 82 % of the mean, band means within ~0.3 t/km2 above 300 m.
    capacity_depth_table:
      - depth_m: 81.0
        capacity: 9.34
      - depth_m: 123.0
        capacity: 4.82
      - depth_m: 173.0
        capacity: 7.18
      - depth_m: 221.0
        capacity: 11.56
      - depth_m: 272.0
        capacity: 3.05
      - depth_m: 300.0
        capacity: 0.20
    max_carrying_capacity: 6.7
    # 3.6 kJ/g WW as eaten (2.8-4.8) J: decapod AFDW/WW 16.5 % x 20.74 kJ/g
    # AFDW = 3.4 (Ricciardi & Bourget 1998; Steimle & Terranova 1985);
    # Calocaris whole ~2.8 (Parslow-Williams 1998); Homarus 4.8. No
    # whole-body Nephrops calorimetry found. Was 4.0 J in section 221.
    energy_content: 3600.0
    spawn:
      mode: equilibrium
    seed_rate: 1e-06
  planktivorous_fish:
    display_name: "Planktivorous Fish"
    # Display only (live viewer hover): the members and their
    # annual-mean biomass weights (section 209, acoustic level, not the
    # GOV catch shares); params_planktivorous_fish.md.
    member_species:
      - {name: herring, share: 0.79}
      - {name: blue whiting, share: 0.105}
      - {name: Norway pout, share: 0.075}
      - {name: sprat, share: 0.03}
    is_decision_maker: true
    maintenance_level: 0.2
    # Lean body + fat reserve (section 140). energy_content is the LEAN
    # tissue, ~4.1 kJ/g from 15-19 % protein (Warren et al. 2026); the
    # reserve is the fat, up to ~18 % (0.396 kJ/g per fat %), so a full
    # herring holds ~11 kJ/g, the North Sea Q3 value of 10.1-11.9
    # (Pedersen & Hislop 2001 via JNCC Report 633). Starvation mortality
    # starts at 0.2 of the reserve (~2 % fat, the spring low of healthy
    # Baltic herring, Rojbek et al. 2014), not at half of it: herring
    # live through the winter on their fat. Predators eat the reserve
    # with the fish (prey_includes_reserve). Section 209: the group is
    # herring 0.79, blue whiting 0.105, Norway pout 0.075, sprat 0.03 of
    # the annual-mean biomass; the lean members lower the weighted maximum
    # reserve 7000 -> 6250 (pout ~2000, blue whiting ~3600), so the static
    # quality at the reference fill 0.5 is 4000 + 0.5 x 6250 = 7125 MJ/t.
    # research_notes/"Fiskgrupper i rutan" (Swedish letters)/params_planktivorous_fish.md.
    max_energy_reserve: 6250.0
    resting_metabolism: 8.0
    # Water temperature (section 143; only with the manifest's
    # simulation_settings.temperature): Q10 2.2 from sprat respirometry,
    # 9-21 C (Meskendahl 2013; clupeids 1.8-2.2). t_ref 14 C because 8
    # MJ/t/tick (32 kJ/kg/d at rest) is the Rudstam/Rose et al. 2008
    # herring resting term at ~14 C, i.e. already a summer value: the
    # multiplier is ~0.5 in Jan-Apr and ~1 in Aug-Sep.
    metabolism_q10: 2.2
    metabolism_t_ref: 14.0
    # Section 184: growth out of this tick's income, not out of the fat.
    # G = min(kappa I - C, B g (s - u) ec): structure is built from food
    # (fat holds no nitrogen; fasting fish lose the GH -> IGF-1 signal),
    # so with no food there is no growth and the summer fat is kept for
    # the winter. The reserve-funded law kept turning it into biomass in
    # Oct-Dec and the stock lost 25-30 %/yr (sections 183.8-184.6).
    # kappa 0.75 [D]: where the ideal-conditions budget closes at today's
    # s* (DEBlipid form, Martin et al. 2017). The budget is paid over a
    # 5.5-month feeding season, Apr - mid-Sep (Bachiller et al. 2018,
    # NSS herring), so g = 12/5.5 x the year-round value; the months size
    # the rate, the food decides when it grows.
    # research_notes/Sillens vinterbudget/growth_allocation.md.
    income_growth_kappa: 0.75
    feeding_season_months: 5.5
    # Juvenile compartment (lib/environments/ecosystem_env/stages.py): the
    # fish below their length at age 1 in Q3 (herring 18.2, sprat 10.9,
    # Norway pout 14.9 cm). growth_ratio = juvenile / adult per-tonne
    # growth (SMS 2023, 2013-22: 1.07 / 0.20); graduation_rate = the
    # stage-structured biomass model's maturation rate (de Roos et al.
    # 2008) from the juvenile growth 1.07, mortality 0.84 and entry /
    # graduation mass 0.13; recruitment = rho by month (arrival Jun-Sep,
    # magnitude to the box J/B 0.38, NS-IBTS 2001-25); start_share = the
    # field cycle by month. fishing_selectivity = F on a juvenile tonne
    # over the group mean (SMS F at age; HAWG 2026).
    # research_notes/"Arsungarnas andel" (Swedish letters: A-ring) parameters_B.md.
    juvenile_stage:
      growth_ratio: 5.3
      graduation_rate: 0.66
      recruitment: [0, 0, 0, 0, 0, 1.7, 4.1, 4.2, 1.8, 0, 0, 0]
      start_share: [0.379, 0.372, 0.366, 0.360, 0.354, 0.355, 0.369, 0.391, 0.403, 0.401, 0.393, 0.386]
      fishing_selectivity:
        pelagic_trawling: 0.7
        bottom_trawling: 1.5
    movement_speed: 1.0
    feeding_cost: 1.9
    movement_cost: 1.5
    energy_content: 4000.0
    prey_includes_reserve: true
    reserve_reference_fill: 0.5
    min_split_biomass: 0.5
    # growth_rate is DERIVED by lib/world/growth_budget.py and recomputed
    # by the loader for every run; the number stored here is what the
    # loader computes for mareld2.yaml (seabirds muted) with
    # --mortality on; with --mortality off the loader leaves M1 out. Edit
    # r_max, natural_mortality or the predation matrix, not this value.
    # r_max: today's productivity (Euler-Lotka r_now, section 185.18
    # method). Section 209: herring 0.35, sprat 0.48, Norway pout 0.46,
    # blue whiting 0.45 at the group weights = 0.37 (0.30-0.46); mackerel
    # (0.25) is in predatory_fish now. Was 0.34 (herring, mackerel, sprat,
    # horse mackerel). research_notes/Den pelagiska poolens reglering/
    # productivity.md; research_notes/"Fiskgrupper i rutan" (Swedish letters)/params_planktivorous_fish.md.
    r_max: 0.37
    # Section 185.20: today's EFFECTIVE capacity (t/km2), standing in for
    # stock-scale compensation (density-dependent recruitment) plus net
    # emigration out of a grid that holds ~0.4 % of the autumn-spawning
    # herring - not local crowding. Section 209: K = B / (1 - P/r) =
    # 3.33 / (1 - 0.115/0.37) = 4.8 (was 5.0 at r 0.34). Without K the
    # pool grew at r_max - F and grazed the zooplankton 10-14x its
    # standing stock per year (resume 185.17-19).
    regional_carrying_capacity: 4.8
    # x 12 / feeding_season_months (5.5) since section 184.
    growth_rate: 0.0035374528067
    # Section 209: M1 = M0 + predation by groups that are not FGs = 0.26
    # /yr (0.11-0.38): herring M0 0.25, sprat 0.42, Norway pout 0.30,
    # blue whiting 0.20, + squid ~0.01. Was 0.580 (Ecopath 1991), which
    # held 0.189 of predation by rays, gurnards, mackerel, horse mackerel,
    # hake and spurdog: those are in benthivorous_fish and predatory_fish
    # now and act through their pairs (M2 ~0.66 /yr in all).
    natural_mortality: 0.000178066
    max_intake_rate: 0.04
    spawn:
      mode: colony
      n_colonies: 25
      sigma_cells: 1.0
      anchor: free
      amplitude_mode: jitter
      amplitude_min: 0.0
      amplitude_max: 1.0
    starve_rate: 0.025
    visibility_floor: 0.35
    # Beddington-DeAngelis w (section 162; was 0.7, set in section 86
    # against the band artefact, not from herring data). No behavioural
    # interference has been measured in herring; per-capita intake falls
    # 0-5 % per doubling of stock density, depletion included (Stenevik
    # et al. 2022, Brunel & Dickey-Collas 2010), and school-scale costs
    # are offset by facilitation. 0.7 cut winter intake by two thirds at
    # 3.4 t/km2 (40 % per doubling). 0.05 = the compromise of
    # research_notes/Sillens vinterfoda/herring_interference.md.
    interference: 0.05
    extinction_threshold_factor: 0.5
  benthivorous_fish:
    display_name: "Benthivorous Fish"
    # Display only (live viewer hover): the members and their long-run
    # (NS-IBTS 2001-25) biomass shares, as in the comment below;
    # research_notes/"Fiskgrupper i rutan"/tables/long_run_species_by_group.csv.
    member_species:
      - {name: haddock, share: 0.386}
      - {name: cod, share: 0.314}
      - {name: long rough dab, share: 0.126}
      - {name: dab, share: 0.045}
      - {name: plaice, share: 0.038}
      - {name: witch, share: 0.017}
      - {name: starry ray, share: 0.015}
      - {name: hagfish, share: 0.013}
      - {name: others, count: 43, share: 0.047}
    is_decision_maker: true
    # Section 209: the demersal fish that feed mainly on the bottom.
    # Long-run (NS-IBTS 2001-25) biomass shares: haddock 0.39, cod 0.31,
    # long rough dab 0.13, dab 0.045, plaice 0.038, witch 0.017, starry
    # ray, hagfish, grey gurnard, lemon sole, weever. Every value below
    # is the biomass-weighted species value;
    # research_notes/"Fiskgrupper i rutan" (Swedish letters)/params_benthivorous_fish.md and benthivores/.
    # u 0.5 is the engine convention (hunger knee and growth zero; 0.1
    # starved the group, resume 187.4); the literature starvation
    # threshold is 0.1-0.2 of the reserve.
    maintenance_level: 0.5
    # Liver / fat reserve: cod and haddock liver max ~2000 MJ/t, plaice
    # 1700-2000, long rough dab 850-1100 -> 1800 (1500-2100).
    max_energy_reserve: 1800.0
    # Weighted SMR 3.0 MJ/t/tick at the 50 m layer (haddock 3.0, cod 3.7,
    # plaice 3.1, long rough dab 1.6, witch 1.5) x 1.2 routine at rest =
    # 3.6 (2.4-4.3). The old gadoid 6.0 was 1.5-2x the measured SMR.
    # Section 223.26: re-read at the bottom layer's annual mean (7.40 C
    # vs at_50m 8.37 C; the group moved there in 223.15) with Q10 2.25:
    # 3.6 x 2.25^((7.40 - 8.37)/10) = 3.33.
    resting_metabolism: 3.33
    # Q10 haddock 2.5, cod 2.2 (Schurmann & Steffensen 1997), plaice 2.0
    # (Fonds 1985). Read as the annual mean of the bottom layer (223.26).
    metabolism_q10: 2.25
    metabolism_t_ref: annual_mean
    # Section 223.27: 1.0, the engine cap (1 cell = 1 km per 6 h), as the
    # predators: residence is behaviour, not a speed limit. Cod and
    # haddock cruise ~0.5 BL/s (40-50 cm: ~4-5 km per 6 h) and plaice
    # move km/day in tagging, so every member is physically above the
    # cap. Was 0.2 (the old gadoid 0.25, gurnard 0.2, flatfish and rays
    # 0.1 read as residence), which left the benthivores the only fish
    # prey unable to leave a cell.
    movement_speed: 1.0
    # Fed / unfed respiration of plaice 2.4 incl. SDA; haddock SDA peak
    # 1.3-1.5 x RMR: 2.0 (1.5-2.5). Cruising haddock 1.48 x SMR, cod
    # 1.32, plaice active/rest 2.4-2.8: 1.6 x RM (judgement for the pool).
    feeding_cost: 2.0
    movement_cost: 1.6
    # Section 223.9: LEAN body 3600 (weighted 3628, 3400-3850: haddock and
    # cod 3.8 kJ/g without the liver store, long rough dab 2.6, dab and
    # plaice 3.6) plus the reserve (liver/lipid, ME 1800), eaten with the
    # fish as for planktivores and predators (section 140). Static prey
    # quality at fill 0.5 = 4500 = the old whole body (roundfish 4.6-4.75
    # kJ/g, plaice 4.6, long rough dab 3.2), so predators' h is unchanged.
    # Was 4500 whole body, with each new tonne charged its reserve on top.
    # research_notes/"Bentivorernas energi och diet" (Swedish letters).
    energy_content: 3600.0
    prey_includes_reserve: true
    reserve_reference_fill: 0.5
    min_split_biomass: 0.5
    # Juvenile compartment (stages.py): the fish below their length at age
    # 1 in Q3 (haddock 27.0, cod 27.1, plaice 16.0, witch 14.8 cm).
    # growth_ratio from SMS (haddock, cod: 2.06 / 0.50); graduation_rate
    # de Roos et al. 2008 (growth 2.06, mortality 1.55, mass ratio 0.06);
    # recruitment by month to the box J/B 0.15; start_share by month;
    # fishing_selectivity: bottom 0.15 (gadoid age 0 unfished, age 1 at
    # 0.08-0.13 of the stock F), pelagic 4 (judgement, F 0.0004).
    # research_notes/"Arsungarnas andel" (Swedish letters: A-ring) parameters_B.md.
    juvenile_stage:
      growth_ratio: 4.1
      graduation_rate: 1.02
      recruitment: [0, 0, 0, 0, 0, 0.2, 0.5, 0.5, 0.2, 0, 0, 0]
      start_share: [0.155, 0.150, 0.147, 0.143, 0.139, 0.139, 0.148, 0.161, 0.169, 0.168, 0.163, 0.159]
      fishing_selectivity:
        bottom_trawling: 0.15
        pelagic_trawling: 4.0
    # growth_rate is DERIVED by lib/world/growth_budget.py and recomputed
    # by the loader for every run; the number stored here is what the
    # loader computes for mareld2.yaml (seabirds muted) with
    # --mortality on; with --mortality off the loader leaves M1 out. Edit
    # r_max, natural_mortality or the predation matrix, not this value.
    # r_max: today's productivity (Euler-Lotka r_now, resume 184.18):
    # haddock 0.24, cod 0.35, plaice 0.40, dab 0.55, witch 0.28, lemon
    # sole 0.50, gurnard 0.65, starry ray 0.15, long rough dab 0.30
    # (judgement) -> 0.31 (0.22-0.41).
    r_max: 0.31
    # K = B* / (1 - F/r) = 1.53 / (1 - 0.17/0.31) = 3.39 t/km2 (section
    # 185 convention; B* = the user's long-run level, the top of the
    # 2001-25 span). Fragile: F/r = 0.55, and cod alone has F > r.
    regional_carrying_capacity: 3.39
    growth_rate: 0.0018656355976
    # M1 = M0 0.20 (SMS convention) + predation by groups NOT in the model
    # 0.09 (squid, halibut, megrim, grey seal) = 0.29 /yr (0.19-0.46).
    # Predation by predatory_fish, seals and porpoises is M2 on pairs.
    natural_mortality: 0.00019861
    max_intake_rate: 0.04
    spawn:
      mode: colony
      n_colonies: 25
      sigma_cells: 1.0
      anchor: free
      amplitude_mode: jitter
      amplitude_min: 0.0
      amplitude_max: 1.0
    # ~181 days to death at an empty reserve at rest (section 46 convention;
    # cod fast 84 d+ without deaths, plaice 180-200 d at 6-7 C).
    starve_rate: 0.010
    # Judgement: gadoids 0.6, flatfish and rays bury and are cryptic (0.4).
    visibility_floor: 0.55
    # Section 223.28: 0. The old 0.45 was the section 86 band fix (w 1.0 at
    # 0.69 t/km2) rescaled, with no fish measurement. Haul-scale tests find
    # none (Barents cod on capelin, Baltic small cod on benthos) or m ~0.2
    # with depletion included (Baltic large cod, flounder); depletion is
    # explicit per cell here; field crowding is ~3x the mean vs the
    # policies' 13x; the per-pair term taxed fish prey 4-8x more than the
    # bed. research_notes/"Interferens hos bottenfisk" (Swedish letters).
    interference: 0.0
    extinction_threshold_factor: 0.5
  predatory_fish:
    display_name: "Predatory Fish"
    # Section 223.26 (predator split G1, user 2026-10-27): the WATER-COLUMN
    # predators. Whiting, the bed feeder (91 % of the pooled group's
    # epifauna flow), is its own group `whiting` below; this group keeps the
    # id but no longer feeds on the bed (benthos 0.3-1 % of every member's
    # diet). Display only (live viewer hover): the members and their
    # long-run (NS-IBTS 2001-25) biomass shares.
    # research_notes/"Rovfiskens uppdelning" (Swedish letters)/params_split_223.md.
    member_species:
      - {name: saithe, share: 0.651}
      - {name: mackerel, share: 0.128}
      - {name: spurdog, share: 0.08}
      - {name: horse mackerel, share: 0.055}
      - {name: hake, share: 0.04}
      - {name: anglerfish, share: 0.022}
      - {name: ling, share: 0.011}
      - {name: velvet belly, share: 0.008}
      - {name: pollack, share: 0.007}
    is_decision_maker: true
    # Section 209 / 223.26: demersal and pelagic fish that feed on fish and
    # krill: saithe 0.65, mackerel 0.13, spurdog 0.08, horse mackerel
    # 0.055, hake 0.04, anglerfish, ling, velvet belly, pollack. Saithe (Q3
    # on the trench slope) and mackerel (summer) are visitors; the closed
    # pool charges them stock-level r and F, as herring. Every value is
    # the biomass-weighted species value (weighted_fields convention, 209).
    # u 0.5: the engine convention (resume 187.4).
    maintenance_level: 0.5
    # Liver / fat reserve: saithe liver ~2000, mackerel ~6000, horse
    # mackerel ~3800, spurdog ~2000 -> 2600 (1950-3250).
    max_energy_reserve: 2600.0
    # Measured SMR at the at_50m annual mean 8.37 C: saithe 3.5, mackerel
    # 3.4, spurdog 2.1, anglerfish 1.2 -> 3.31 (2.8-5.0).
    resting_metabolism: 3.31
    # Cod SMR 2.2-2.6, ICES gastric evacuation exponent 2.25, mackerel 2.0,
    # spurdog 2.5 -> 2.3; annual mean of the at_50m layer.
    metabolism_q10: 2.3
    metabolism_t_ref: annual_mean
    # Every member but anglerfish cruises 6-15 cells/tick (saithe Uopt
    # 1.4 BL/s, mackerel schools 0.44-0.72 m/s net); residence is
    # behaviour, not a speed limit.
    movement_speed: 1.0
    # Routine 1.5 x SMR + SDA 0.17 of half the ceiling 32.71 (Bjornsson-
    # anchored, 223.26) = 2.34 x RM; cruising at Uopt 2-2.5 x SMR = 2.0 x RM.
    feeding_cost: 2.34
    movement_cost: 2.0
    # Lean tissue as eaten (saithe 4.0, hake 3.7, mackerel 4.7, spurdog
    # 6.0 kJ/g) = 4240; the liver / fat is eaten with the fish: at the
    # reference fill 0.5 the static quality is 4240 + 0.5 x 2600 = 5540 MJ/t.
    energy_content: 4240.0
    prey_includes_reserve: true
    reserve_reference_fill: 0.5
    min_split_biomass: 0.5
    # growth_rate is DERIVED by lib/world/growth_budget.py and recomputed
    # by the loader for every run; the number stored here is what the
    # loader computes for mareld2.yaml (seabirds muted) with
    # --mortality on; with --mortality off the loader leaves M1 out. Edit
    # r_max, natural_mortality or the predation matrix, not this value.
    # r_max: today's productivity (Euler-Lotka r_now): saithe 0.44, hake
    # 0.26, mackerel 0.25, horse mackerel 0.33, spurdog 0.07, anglerfish
    # 0.47, ling 0.55 -> 0.374 (0.32-0.42).
    r_max: 0.374
    # K = B* / (1 - F/r) = 0.754 / (1 - 0.242/0.374) = 2.14 t/km2 (1.05-11;
    # saithe F 0.11-0.38 drives it; the user chose the central value).
    regional_carrying_capacity: 2.14
    growth_rate: 0.0014965884949
    # M1 = M0 + predation by groups NOT in the model: saithe 0.29,
    # mackerel 0.15, spurdog 0.10, horse mackerel 0.30, hake 0.45,
    # anglerfish 0.25 -> 0.261 /yr (0.18-0.30). Within-group predation
    # (~0.035) is a transfer inside the pool and left out.
    natural_mortality: 0.000179093
    max_intake_rate: 0.04
    spawn:
      mode: colony
      n_colonies: 25
      sigma_cells: 1.0
      anchor: free
      amplitude_mode: jitter
      amplitude_min: 0.0
      amplitude_max: 1.0
    # 1.5 x SMR / lean energy / 0.15 (the section 209 construction).
    starve_rate: 0.0078
    # Judgement: midwater schools of saithe and mackerel hide badly.
    visibility_floor: 0.7
    # No field evidence of interference for saithe or mackerel (Rindorf et
    # al. 2006: predator density did not affect intake).
    interference: 0.1
    extinction_threshold_factor: 0.5
  whiting:
    display_name: "Whiting"
    # Section 223.26 (predator split G1, user 2026-10-27): the BED-feeding
    # predators = whiting alone (0.446 t/km2, 0.37 of the pooled group;
    # 92 % of its benthos consumption). Resident all year, within ~5-30 m
    # of the bed by day. research_notes/"Rovfiskens uppdelning" (Swedish letters)/params_split_223.md.
    member_species:
      - {name: whiting, share: 1.0}
    is_decision_maker: true
    maintenance_level: 0.5
    # Gadoid liver ~2000 MJ/t (1500-2500).
    max_energy_reserve: 2000.0
    # SMR 4.2 (Steinhausen et al. 2005, attributed to 8.4 C) re-read at the
    # bottom layer's annual mean 7.40 C with Q10 2.3: 3.87 (3.0-4.6).
    resting_metabolism: 3.87
    metabolism_q10: 2.3
    metabolism_t_ref: annual_mean
    # Uopt 1.0 BL/s = 5.8 cells/tick at 27 cm; not binding.
    movement_speed: 1.0
    # Routine 1.5 x SMR + SDA 0.17 of half the ceiling 31.34 (GER Cmax 96.4
    # kJ/kg/d at 7.40 C x 1.30 Bjornsson re-anchoring, 223.26) = 2.19 x RM;
    # cruising 2 x SMR.
    feeding_cost: 2.19
    movement_cost: 2.0
    # Lean 3.9 kJ/g; the liver is eaten with the fish: at the reference
