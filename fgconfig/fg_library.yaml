  # biomass-weighted (cod 83, haddock 144, plaice 119, dab 100, long
  # rough dab 86 kJ/kg/d at the 50 m layer) = 108 kJ/kg/d = 27.1
  # MJ/t/tick; h = E_prey / 27.1 (section 148 energy convention).
  # Section 223.15: the ceiling at the BOTTOM temperature (7.4 C annual,
  # not the 8.4 C of the 50 m layer), haddock at x1.0 of cod (every sub-
  # adult/adult datum is at or below cod; the x1.3 was juvenile pellet
  # trials) and cod from Bjornsson et al. 2001 ad-lib (FB4 basis was 20 %
  # lower; Jobling 1988 agrees within 3-5 %): 104.7 kJ/kg/d (87-120) =
  # 26.18 MJ/t/tick; every benthivore pair's h = E_prey / 26.18.
  # Section 223.15: a = a_enc x e, the share of the accessible layer that
  # is detectable and takeable per pass (buried bodies found only by a
  # siphon/palp cue, cropped arm tips and siphons, arms retracted, crab
  # size window, flatfish at a chemo-tactile width in the dark):
  # infauna e 0.165 (0.11-0.27) -> 0.036 (0.016-0.092). Passes the
  # independent diet-vs-availability test (infauna 0.63 / epifauna 0.27
  # vs field 0.54 / 0.31; the old a gave 0.83 / 0.15). Still saturated
  # (x 19-66): the field feeding level is a time-budget matter. research_notes/"Exponering av bottenbyten" (Swedish letters).
  # Section 221 (infauna only): diet share 0.511 of the consumption
  # (benthos 0.72 x infauna 0.71; ICES stomachs, consumption-weighted),
  # M2 = Q/B 3.48 x 1.53 x 0.511 / B* 93.6 = 0.029; h = 2600 / 27.1 =
  # 95.9; accessible_fraction 0.2 (Dauwe et al. 1998: the top 0-2 cm,
  # section 208); a 0.25 (MC 5-95 % 0.12-0.64; the encounter split of
  # section 220's 0.26). No light effect. research_notes/"Infauna och rorlig epifauna" (Swedish letters)/params_split.md.
  # Section 223.9: M2 = Q/B 4.46 (the energy-budget 4.2 on the redistributed,
  # lower-quality diet; 3.6-5.3) x 1.53 x share / prey mean; the 17.7 % of
  # the diet without a pool redistributed (central): infauna 0.544,
  # epifauna 0.314, planktivores 0.120, predators 0.023.
  # research_notes/"Bentivorernas energi och diet" (Swedish letters).
