    r_max: 0.49
    # K = B* / (1 - F/r) = 0.446 / (1 - 0.08/0.49) = 0.533 t/km2 (0.48-0.68).
    regional_carrying_capacity: 0.533
    growth_rate: 0.0030475367763
    # M1 = SMS residual M 0.20 + grey seal and birds 0.05 = 0.25 /yr
    # (0.20-0.32). Booked on pairs: benthivores 0.18 (223.28), predatory_fish
    # 0.157, porpoises 0.019, seals 0.013; total M 0.62 vs SMS 0.685.
    natural_mortality: 0.000171233
    max_intake_rate: 0.04
    spawn:
      mode: colony
      n_colonies: 25
      sigma_cells: 1.0
      anchor: free
      amplitude_mode: jitter
      amplitude_min: 0.0
      amplitude_max: 1.0
    # 1.5 x SMR / lean energy / 0.15 (the section 209 construction).
    starve_rate: 0.0099
    # Judgement: whiting on the bed hide better than midwater schools.
    visibility_floor: 0.5
    # Rindorf et al. 2006: predator density not significant for whiting.
    interference: 0.1
    extinction_threshold_factor: 0.5
  porpoises:
    display_name: "Porpoises"
    is_decision_maker: true
    maintenance_level: 0.5
    max_energy_reserve: 2800.0
    # Section 145: resting_metabolism is REST (no foraging, no travel),
    # not field metabolic rate. 60 MJ/t/tick = 0.24 MJ/kg/day, near the
    # lab rate of two 28 kg juveniles (Reed et al. 2000: 247 ml O2/min,
    # 1.9x Kleiber). The 90 of 2026-06-01 put FMR into rest and then
    # charged eat and move on top of it.
    resting_metabolism: 60.0
    # No metabolism_q10 (section 143): an endotherm; wild field metabolic
    # rate is flat over 0-20 C water and FMR barely changed between Dec,
    # Aug and Feb (Rojano-Donate et al. 2018).
    movement_speed: 1.0
    # Eat = the measured FMR of wild porpoises, which forage day and
    # night, so it includes hunting and the heat increment of feeding:
    # 60 * 1.5 = 90 MJ/t/tick = 0.36 MJ/kg/day vs 0.35 for wild adults
    # (Rojano-Donate et al. 2018: 21.7 MJ/day = 12.1 ml O2/kg/min; up to
    # +30 % if each breath is underestimated). Break-even ration on
    # clupeids 90 / 6750 = 0.0133 t/t/tick = 5.3 % of body mass per day
    # (Kastelein 4-9.5 %).
    feeding_cost: 1.5
    # Move = swimming without hunting or digestion, so below eat: most of
    # FMR is already locomotion (min cost of transport 2.4 J/kg/m at
    # 1.3-1.5 m/s, Otani et al. 2001) and a move tick has no intake. No
    # porpoise measurement separates travel from foraging; 1.3 is a
    # judgement between rest and eat.
    movement_cost: 1.3
    # Indivisible unit = one porpoise (~50-60 kg; Rojano-Donate et al.
    # 2018 imply ~62 kg). Cells below it take one action per tick. 250 kg
    # (2026-09-14, a proxy for coherent movement, section 71.11) made
    # every porpoise cell one-hot, so the argmax hid a ~25 % move
    # probability and a moving cell gave up a whole tick of food; on
    # frozen fix53 policies 50 kg ended the year at 4.5 t vs 2.9 t
    # (section 152). Also sets the spawn floor (5x = 250 kg per cell).
    min_split_biomass: 50.0
    energy_content: 8500.0
    # growth_rate is DERIVED by lib/world/growth_budget.py and recomputed
    # by the loader for every run; the number stored here is what the
    # loader computes for mareld2.yaml (seabirds muted) with
    # --mortality on; with --mortality off the loader leaves M1 out. Edit
    # r_max, natural_mortality or the predation matrix, not this value.
    # r_max 0.10 /yr (Lockyer 2003; Caswell et al. 1998; Forney et al.
    # 2021: 9.6 %/yr after bycatch ended).
    r_max: 0.10
    growth_rate: 0.00046279049
    # M = M1 = 0.10 /yr, biomass weighted (Leslie models from adult
    # survival 0.90-0.95 excluding bycatch, plus calf mortality). No FG
    # preys on porpoises. Was 6.0e-05.
    natural_mortality: 6.85e-05
    # Physiological intake ceiling, NOT the realised ration: 0.035 t prey
    # per t predator per tick = 14 % of body mass per day. Kastelein et
    # al. measure 4-9.5 %/day for captive harbour porpoises, so the cap
    # sits ~1.5x above the highest observed ration, which is what a
    # ceiling is supposed to do. The previous 0.05 (20 %/day) was 2x the
    # observed maximum and the un-anchored (since removed) satiation_scale was silently
    # doing the ceiling's job of setting the ration (Section 92).
    max_intake_rate: 0.035
    spawn:
      mode: env_driven
      floor: 0.0
      noise_amp: 0.0
      noise_scale: 4.0
      min_frac_of_max: 0.0
      refs:
        - name: planktivorous_fish
          weight: 1.0
          transform: linear
    starve_rate: 0.5
    visibility_floor: 0.0
    # Left at 0: porpoises never reach densities where interference
    # matters (they occupy a handful of cells at <1 ton each) and are
    # already the group most at risk of extinction. Section 86.
    interference: 0.0
    # Sweep at 0.1 * 50 kg = 5 kg per cell, as before section 152.
    extinction_threshold_factor: 0.1
  seals:
    # Harbour seals only (section 166): grey seals are a few individuals
    # in Swedish Skagerrak (HaV 2025; Carroll et al. 2025) and too large
    # for the one-seal unit below.
    display_name: "Seals"
    is_decision_maker: true
    maintenance_level: 0.5
    # ~14 % of body mass as blubber; adults swing ~4000-4200 MJ/t over the
    # year (Olesiuk 1993; Karpovich).
    max_energy_reserve: 5200.0
    # REST, as for porpoises (section 145): 50 MJ/t/tick = 0.20 MJ/kg/day,
    # 1.9x Kleiber at the 55 kg population mean; captive adults resting
    # after a meal 45-52 (Paterson et al. 2021). Was 45. No metabolism_q10:
    # thermoneutral in 6-17 C water (Olesiuk 1993).
    resting_metabolism: 50.0
    movement_speed: 1.0
    # Eat = field metabolic rate incl. the heat increment of feeding
    # (10-17 % of gross intake, ~15 h; Markussen 1994), above move =
    # transit swimming (~2.2x rest at 1.4 m/s, Davis 1985 / Williams 1987
    # via Olesiuk 1993). The porpoise order; was eat 1.3 / move 1.5.
    feeding_cost: 1.5
    movement_cost: 1.3
    # Indivisible unit = one seal of the population mean mass: 0-3 year
    # olds are ~half the population, so ~55 kg (Olesiuk 44.7, Haerkoenen &
    # Heide-Joergensen 41.8 for younger, growing populations). Was 80 kg,
    # an adult.
    min_split_biomass: 55.0
    # Lean value, as for pelagic_fish (whole body ~15.9 MJ/kg at 30 %
    # blubber, Olesiuk 1993). prey_includes_reserve is not set because
    # nothing eats seals; set it if a seal predator is added.
    energy_content: 10000.0
    # growth_rate is DERIVED by lib/world/growth_budget.py and recomputed
    # by the loader for every run; the number stored here is what the
    # loader computes for mareld2.yaml (seabirds muted) with
    # --mortality on; with --mortality off the loader leaves M1 out. Edit
    # r_max, natural_mortality or the predation matrix, not this value.
    # r_max 0.11 /yr: harbour seal 10.2-13.6 %/yr in Kattegat-Skagerrak
    # after 1988 (Carroll et al. 2025), grey seal <= 10 % (HELCOM).
    r_max: 0.11
    # Regional carrying capacity (section 199, variant b): K = the 15 t
    # start / 3600 km2, so the seals sit at today's level with no hunt
    # impact. The grid holds the offshore tail of the Kattegat-Skagerrak
    # metapopulation, which is regulated off the grid (Skagerrak at 0.82
    # of its logistic K 4,517 counted seals, Carroll et al. 2025: food -
    # prey the model's seals do not eat - and haul-out competition).
    # Without it the seals grew ~6 %/yr on gadoids alone, halved them and
    # crashed (15-year run on fix70). Outside the derived growth_rate.
    # Section 206: 0.0075 (27 t), was 0.0041667 (= the 15 t start). The
    # loss is charged at r_max (0.11 B/K /yr) while the trained seals
    # realise ~0.18 gross, i.e. ~0.06 /yr after M1 and starvation, so
    # K = start settled at ~0.5 K in 30-50 years (fix72). 15 x 0.11 / 0.06
    # = 27 t puts the equilibrium at today's 15 t and sits between the
    # 199.3 routes to K_box (24 t; 36-38 t).
    regional_carrying_capacity: 0.0075
    growth_rate: 0.00048891653
    # M = M1 = 0.10 /yr, biomass weighted (Leslie models); no FG preys on
    # seals. Was 6.0e-05.
    natural_mortality: 6.85e-05
    # Fallback attack rate; every seal pair sets its own (sections 166, 209).
    max_intake_rate: 0.05
    # Spawn on the main prey, as porpoises spawn on herring (user's call,
    # section 166). The 7 free colonies started with ~no gadoid overlap.
    # Section 209: the demersal fish are two groups now.
    spawn:
      mode: env_driven
      floor: 0.0
      noise_amp: 0.0
      noise_scale: 4.0
      min_frac_of_max: 0.0
      refs:
        - name: benthivorous_fish
          weight: 1.0
          transform: linear
        - name: predatory_fish
          weight: 1.0
          transform: linear
        - name: whiting
          weight: 1.0
          transform: linear
    # 1.5 % of biomass per tick at an empty reserve: blubber lets a seal
    # fast for weeks (30-60 day target, section 147).
    starve_rate: 0.03
    visibility_floor: 0.0
    # Sweep at 0.1 * 55 kg = 5.5 kg per cell, as for porpoises (section
    # 152); the default 0.5 cleared cells below 40 kg.
    extinction_threshold_factor: 0.1
    interference: 0.0
  seabirds:
    display_name: "Seabirds"
    # Display only (live viewer hover): the species in the group,
    # research_notes/"Fiskgrupper i rutan"/params_top_predators.md.
    member_species:
      - {name: kittiwake}
      - {name: guillemot}
      - {name: razorbill}
      - {name: gannet}
      - {name: gulls}
    is_decision_maker: true
    max_energy_reserve: 3400.0
    resting_metabolism: 135.0
    movement_speed: 1.0
    feeding_cost: 2.2
    movement_cost: 2.8
    min_split_biomass: 1.0
    maintenance_level: 0.5
    energy_content: 7000.0
    # growth_rate is DERIVED by lib/world/growth_budget.py and recomputed
    # by the loader for every run; the number stored here is what the
    # loader computes for mareld2.yaml (seabirds muted) with
    # --mortality on; with --mortality off the loader leaves M1 out. Edit
    # r_max, natural_mortality or the predation matrix, not this value.
    # r_max 0.10 /yr: Niel & Lebreton on JNCC 552 rates (guillemot 0.08,
    # razorbill/gannet 0.10, kittiwake/gulls 0.11-0.16).
    r_max: 0.10
    growth_rate: 0.00047521098
    # M = M1 = 0.15 /yr, biomass weighted with juveniles (Leslie Z:
    # guillemot 0.145, kittiwake 0.16, gannet 0.20); no FG preys on
    # seabirds. Was 8.0e-05 (adult-only 0.117 /yr).
    natural_mortality: 0.0001027
    max_intake_rate: 0.15
    spawn:
      mode: colony
      n_colonies: 4
      sigma_cells: 2.0
      anchor: free
      amplitude_mode: uniform
      amplitude_min: 0.0
      amplitude_max: 1.0
    starve_rate: 0.2
    visibility_floor: 0.0
interaction_definitions:
  # predation_mortality (per pair, 1/yr): the literature predation
  # mortality of the column FG caused by the row FG (North Sea Ecopath
  # 1991, Mackinson & Daskalov 2007, every species under the umbrella
  # terms; phytoplankton: 20 % of 0.31 d-1). While the pair is checked
  # (preys_on) and the predator is active, it is added to the prey's
  # growth_rate (lib/world/growth_budget.py); unchecking removes it.
  # It is a budget entry, not the realised predation of the tick.
  # zooplankton -> phytoplankton, Holling II f(B) = a B / (1 + a h B):
  # the ceiling 1/h = 0.25 t/t/tick (= zooplankton max_intake_rate,
  # 100 % WW/day, 0.44 body energy/day) is unchanged; the pair-level
  # attack rate a = 0.0125 sets the half-saturation 1/(a h) = 20 t/km2
  # (section 134). Copepod literature puts it at ~5-60 g WW/m2 for a
  # 10-20 m feeding layer; the old a = 0.25 (h = 1/a convention) gave
  # 1 t/km2, so zooplankton fed at the ceiling at almost any phyto
  # density and grazed it down to 0.5-0.8 t/cell
  # (reports/Zooplankton energibudget.md).
  zooplankton_preys_on_phytoplankton:
    handling_time: 4.0
    preys_on: true
    # Section 177: copepods feed on CONCENTRATION. Half-saturation 50
    # ug C/l (low end of 50-150, copepod_energetics.md) = 5 t/km2 in the
    # 10 m reference layer at C:WW 0.1, so a = 1/(4 x 5) = 0.05, scaled
    # by 10 / M(t) (3 t/km2 in the 6 m summer layer, 8.5 in November).
    # 100 ug C/l starved even a rule-driven zooplankton in the plankton
    # calibration. Was 0.0125 = a fixed 20 t/km2 (section 134).
    # Section 202: Type III (copepods' sigmoid response at low food,
    # Frost 1975; Kioerboe et al. 1996 [F]): a = 0.03 per (t/km2)^2 at
    # 10 m, half-saturation 1/sqrt(a h) = 2.9 t/km2. Type II grazed the
    # summer mixed layer to 0.01-0.06 ug chl/l (A17 0.46-0.94) and left
    # the regenerated nitrate unused; 0.01 collapsed a frozen
    # zooplankton's spring in scratch (201.4). Was Type II, a 0.05.
    functional_response: 3
    max_intake_rate: 0.03
    mixed_layer_reference_m: 10.0
    predation_mortality: 22.63
    assimilation_factor: 0.65
  zooplankton_preys_on_microzooplankton:
    # Section 177: no size-independent preference (Tiselius 1989 [F]);
    # protists are better food. Section 178: Type III (prey switching:
    # copepods turn from suspension to ambush feeding as ciliates become
    # common, Kioerboe et al. 1996 [F]). Type II let fix62's trained
    # zooplankton (9-10 t/km2 in March) graze the microzooplankton to
    # 1e-18 in two weeks, for good. a is per (t/km2)^2 at 10 m; 0.1 =
    # the Type II clearance 0.05 at 0.5 t/km2 of microzooplankton.
    handling_time: 4.0
    preys_on: true
    max_intake_rate: 0.1
    functional_response: 3
    mixed_layer_reference_m: 10.0
    assimilation_factor: 0.8
  microzooplankton_preys_on_phytoplankton:
    # Section 177. Imax 1.7 /d at 10 C (Hansen et al. 1997 [F]) = 0.425
    # per tick = 1/h; half-saturation 70 ug C/l = 7 t/km2 at 10 m (field
    # ~30, range 10-80; lab 75-300; 3 t/km2 over-grazed the bloom in the
    # calibration), a = 1/(2.353 x 7) = 0.0607, scaled by 10 / M(t); Q10
    # on the grazer. food_threshold 1.2 t/km2 at 10 m = ERSEM's 12 mg
    # C/m3 food-perception term (sigmoid at low prey, a refuge; without
    # it the pair oscillates to near-zero phytoplankton). predation_mortality is the RATE
    # RATIO the phytoplankton budget needs, not a measured annual
    # mortality: 60 % of the gross 0.67 /d (Calbet & Landry 2004),
    # 0.6 x 0.67 x 365 = 146.7 /yr, so the phytoplankton growth_rate is
    # the gross dilution rate.
    preys_on: true
    max_intake_rate: 0.0607
    handling_time: 2.353
    mixed_layer_reference_m: 10.0
    food_threshold: 1.2
    predation_mortality: 146.7
  zooplankton_preys_on_subsurface_phytoplankton:
    # Section 180: as zooplankton_preys_on_phytoplankton (a 0.05, h 4 =
    # half-saturation 50 ug C/l at 10 m); the prey is diluted over the
    # subsurface layer, so the scale is 10 / H(t), H = bottom_m - M(t).
    handling_time: 4.0
    preys_on: true
    max_intake_rate: 0.05
    mixed_layer_reference_m: 10.0
    predation_mortality: 22.63
    assimilation_factor: 0.65
  microzooplankton_preys_on_subsurface_phytoplankton:
    # Section 180: as microzooplankton_preys_on_phytoplankton (ciliates
    # and dinoflagellates are abundant at the subsurface maximum), the
    # same rate ratio in the budget, diluted over H(t).
    # Section 182: the microzooplankton sees only the edible share
    # e = floor + (1 - floor) N/(N + K) of the subsurface producer, N its
    # layer's nitrate. This describes THIS producer's late-summer
    # community, not a general size law (diatoms win at HIGH nitrate):
    # in the stratified, nitrate-poor layer at the pycnocline the
    # Tripos/Ceratium dinoflagellates dominate (Kattegat Aug-Sep bloom,
    # >50 um = 57-62 % of chl, Nielsen & Kioerboe 1994 [F]), out of reach
    # of ciliates (max prey ~35 um, Hansen 1991 [F]); the heterotrophic
    # dinoflagellates that eat them take 6-9 %/d of production and lag
    # the bloom (Nielsen 1991 [F]), hence a floor above 0. At winter
    # nitrate (4-5 umol/l) e is ~0.75. floor 0.1 and K 2 umol/l are [D],
    # fitted to A17's Oct-Nov zooplankton and column chlorophyll
    # (research_notes/Mikrozooplankton/autumn_microzooplankton.md).
    # predation_mortality stays the rate ratio: the realised grazing now
    # falls below it in late summer, which is the mechanism.
    edibility_floor: 0.1
    edibility_half_saturation_umol_l: 2.0
    preys_on: true
    max_intake_rate: 0.0607
    handling_time: 2.353
    mixed_layer_reference_m: 10.0
    food_threshold: 1.2
    predation_mortality: 146.7
  # Section 209: M2 on zooplankton = Q/B 5.0 x 3.33 t/km2 x zooplankton
  # share 0.91 / 9.72 t/km2 (the 35 000 t start) = 1.6 /yr (1.2-3.1).
  # Was 5.24 (Ecopath herring + sprat + sandeel over the A17 stock).
  # Ceiling from measured Cmax read as energy (section 148 convention):
  # weighted 0.42 kJ/g/d (herring Rudstam 0.47-0.51, sprat 0.75-0.81,
  # pout and blue whiting cod proxies 0.13-0.17) -> h 40 (32-47) on
  # 4.5 kJ/g zooplankton; the old h 25 was 1.6-1.7x any measured Cmax.
  # If the herring lab rations (De Silva & Balbontin 1974) hold, h ~115.
  # Type II with visibility floor 0.5 (section 162). Daylight: herring
  # hunt by sight (0.1); pout and blue whiting feed by night as well
  # (Onsrud et al. 2004): weighted dark_ratio 0.25 (judgement; section
  # 209, replaced by the encounter-theory values of section 220 below).
  # research_notes/"Fiskgrupper i rutan" (Swedish letters)/params_planktivorous_fish.md, planktivores/.
  planktivorous_fish_preys_on_zooplankton:
    preys_on: true
    predation_mortality: 1.6
    assimilation_factor: 0.8
    handling_time: 40.0
    # Section 220: attack rate from encounter theory (f pi R^2 v p per fish,
    # summed over the size structure, over the 25 m pool layer), for fish
    # that FORAGE inside the pool (the eat share is the policy's): 0.017
    # (MC 5-95 % 0.0039-0.032), the annual time mean; herring 94 % of it.
    # Was 0.04 inherited. Night/day 0.02 (0.008-0.08): herring bite by
    # sight and only filter in the dark; half detection at sun ~0 deg.
    # The copepods' own refuge is left to their hide action.
    # research_notes/"Attackrater ur motesteori" (Swedish letters)/planktivores_encounter.md, summary.md.
    max_intake_rate: 0.017
    dark_ratio: 0.02
    light_threshold_deg: 0.0
    visibility_floor: 0.5
    functional_response: 2
  # Section 209: mostly cod on Norway pout and herring; predator_share
  # 0.31 from gape (the cod stages that can swallow pool-sized prey;
  # removed in section 221).
  # M2 0.14 /yr (0.07-0.32). Type II: measured prey switching in
  # North Sea gadoids is negative (Rindorf et al. 2006); the old Type
  # III on gadoids -> herring was a stability fix (section 141).
  # Light dependence: section 220 below (was the old gadoid pair's, 144).
  # Section 223.9: M2 = Q/B 4.46 (the energy-budget 4.2 on the redistributed,
  # lower-quality diet; 3.6-5.3) x 1.53 x share / prey mean; the 17.7 % of
  # the diet without a pool redistributed (central): infauna 0.544,
  # epifauna 0.314, planktivores 0.120, predators 0.023.
  # research_notes/"Bentivorernas energi och diet" (Swedish letters).
  # Section 223.15: h = 7125 / 26.18 (the benthivores' bottom-water ceiling).
  benthivorous_fish_preys_on_planktivorous_fish:
    preys_on: true
    predation_mortality: 0.245
    assimilation_factor: 0.8
    # Section 223.28: h = E / ceiling_j, ceiling_j = 26.18 (E/4.184)^(1-b) / A,
    # b 0.75 (gadoid gastric evacuation ~E^-b), armour 1.0; was 272.1
    # (pure energy ceiling). research_notes/"Magtomning och energitak" (Swedish letters).
    handling_time: 238.2
    visibility_floor: 0.25
    functional_response: 2
    # Section 220: encounter theory, pi R^2 v_rel p with R by the light at
    # the bottom (Kd 0.25 in the top 20 m), in a 10 m near-bottom search
    # band, times the share of the prey inside it (the vertical overlap is
    # in a; section 221 removed predator_share): 0.019 (MC 5-95 %
    # 0.0013-0.071). Was 0.04 inherited. Night/day 0.06; at 140 m the
    # light is too dim for the old -5 deg threshold.
    # research_notes/"Attackrater ur motesteori" (Swedish letters)/benthivores_encounter.md, summary.md.
    # Section 223.26: per WHOLE benthivore tonne (the engine has no phi
    # since 221): 0.019 per capable tonne x the gape share 0.32 = 0.0062.
    # research_notes/"Rovfiskens uppdelning" (Swedish letters)/params_split_223.md section 5.
    max_intake_rate: 0.0062
    dark_ratio: 0.06
    light_threshold_deg: 0.0
    # Stage access [juvenile, adult] (stages.py): cod's window (prey <= 0.30
    # x its length, box cod > 20 cm) on the planktivores' stage lengths.
    # research_notes/"Arsungarnas andel" (Swedish letters: A-ring) parameters_B.md section 4.
    stage_access: [0.49, 0.14]
  # Section 223.26 (split G1): a per tonne of the WHOLE group (the engine has
  # no phi since 221; layer convention), h = E_prey / the group's ceiling
  # (Bjornsson-anchored: whiting 31.34, water column 32.71 MJ/t/tick).
  # M2 = Q x diet share / prey B, scaled so the two groups add to the
  # pooled pair. Type II (Rindorf et al. 2006). research_notes/"Rovfiskens uppdelning" (Swedish letters)/params_split_223.md.
  # Water column on planktivores: diet share 0.52 (saithe on Norway pout
  # and blue whiting, mackerel, hake on herring); a set by mackerel 0.49,
  # saithe 0.33, horse mackerel 0.12. Night/day 0.39 derived.
  predatory_fish_preys_on_planktivorous_fish:
    preys_on: true
    predation_mortality: 0.34
    assimilation_factor: 0.8
    handling_time: 217.8
    visibility_floor: 0.25
    functional_response: 2
    max_intake_rate: 0.0117
    dark_ratio: 0.39
    light_threshold_deg: -5.0
    # Stage access: the members' windows (mackerel 0.33, saithe 0.30, horse
    # mackerel 0.31, hake 0.50 x length; SMS stomachs) weighted by their
    # share of a. Effective 0.19 at the box J/B (was 1). research_notes/"Arsungarnas andel" (Swedish letters: A-ring) parameters_B.md section 4.
    stage_access: [0.32, 0.11]
  # Whiting on planktivores (adults on sprat, Norway pout, herring): diet
  # share 0.28. Night/day 0.33 derived.
  whiting_preys_on_planktivorous_fish:
    preys_on: true
    predation_mortality: 0.16
    assimilation_factor: 0.8
    handling_time: 227.3
    visibility_floor: 0.25
    functional_response: 2
    max_intake_rate: 0.021
    dark_ratio: 0.33
    light_threshold_deg: -5.0
    # Stage access: whiting's window (0.39 x length; box whiting 22-28 cm
    # -> 9-11 cm prey) on the planktivores' stage lengths. Effective 0.05
    # at the box J/B (was 1). research_notes/"Arsungarnas andel" (Swedish letters: A-ring) parameters_B.md section 4.
    stage_access: [0.12, 0.008]
  # Section 209: porpoise diet 0.65 planktivores, 0.15 benthivores, 0.20
  # predators (Skagerrak/Kattegat stomachs 1985-96; Ransijn et al. 2021
  # relative attack rates whiting 1.2x, cod 0.6x herring). Q/B 19.5 ->
  # 234 t/yr at 12 t; M2 0.0127. Mass ceiling h 28.6 as before; a as
  # section 206. research_notes/"Fiskgrupper i rutan" (Swedish letters)/params_top_predators.md.
  porpoises_preys_on_planktivorous_fish:
    preys_on: true
    predation_mortality: 0.0127
    max_intake_rate: 0.0225
    assimilation_factor: 0.9
    handling_time: 28.6
    visibility_floor: 0.95
  # Section 209: harbour seal diet by mass in the pools 0.60 benthivores
  # (cod, flatfish, haddock), 0.15 predators, 0.25 planktivores
  # (Koster 1977-89, Kappa 2026, Sorlie 2020). Ration 320 t/yr at 15 t:
