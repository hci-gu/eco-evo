  # Bottom otter trawling on the benthos (section 161): direct seabed
  # mortality, loss per tick = d x SAR / 1460 with the effort map in
  # MW-h/km2/year. SAR (whole gear footprint, ICES "surface") per unit
  # effort k = 0.75 /yr (range 0.6-1.1; ICES WGSFD SAR per MW-h/km2 where
  # otter trawls dominate, 2019-2024, matching the 2021-2024 level of the
  # map; Eigaard et al. 2016 gear widths give 0.9-1.1 for 300-500 kW
  # shrimp/Nephrops trawlers). d = 0.10 per pass (range 0.06-0.115;
  # Rijnsdorp et al. 2020 OT_CRU, from Hiddink et al. 2017's otter-trawl
  # 0.06 scaled by the digging share; Pitcher et al. 2022 mud 0.115).
  # Slope d k / 1460 = 5.137e-5 per tick per unit; the grid mean (3.0)
  # is SAR 2.3, a loss of 0.226 /yr. Section 218: plus the trawl's catch
  # of community members (user: catch and killed infauna together):
  # 0.68 t/km2/yr at mean effort (0.39-1.43; northern shrimp 0.34,
  # Nephrops 0.30 incl. dead discards, crabs and other invertebrates
  # 0.05; STECF FDI, Norwegian ERS, ICES advice 2025), 0.007 /yr of the
  # ~99 t/km2 community, additive to d (grab-based d misses them): 0.233
  # /yr in all, slope 5.292e-5 per tick per unit. Only the biomass factor
  # acts on a non decision maker. research_notes/Bottentralning och
  # bentos/ and "Bottensamhallets epifauna"/summary_trawl_removal.md.
  # Section 221 (infauna only): the gear's kill, d 0.06 (0.03-0.115) x
  # SAR 0.75 per MW-h/km2: 0.136 /yr at the map's mean effort 3.0142
  # (Hiddink et al. 2017 d pooled 0.06; on Nephrops mud the infauna per
  # pass is at or below it; the 0.10 was a gear-geometry scaling for the
  # pooled community). No catch: the trawl lands no infauna. Was 0.233
  # for infauna + epifauna. research_notes/"Infauna och rorlig epifauna" (Swedish letters)/params_split.md.
  benthic_infauna_impacted_by_bottom_trawling:
    impact_affects: true
    impact_table:
      - value: 0.0
        biomass_factor: 0.0
        energy_factor: 0.0
      - value: 100.0
        biomass_factor: 0.003082
        energy_factor: 0.0
  benthic_infauna_impacted_by_pelagic_trawling:
    impact_affects: false
    impact_table: []
