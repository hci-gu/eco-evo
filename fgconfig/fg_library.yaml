species_definitions:
  phytoplankton:
    current_response: 1.0
    display_name: "Phytoplankton"
    is_decision_maker: false
    movement_speed: 0.0
    # growth_rate is DERIVED by lib/world/growth_budget.py and recomputed
    # by the loader for every run; the number stored here is what the
    # loader computes for mareld2.yaml (seabirds muted) with
    # --mortality on; with --mortality off the loader leaves M1 out. Edit
    # r_max, natural_mortality or the predation matrix, not this value.
    # NDM: g = (r_max + checked predation_mortality on this FG) / 1460.
    # The logistic r is the growth at LOW density, net of the losses the
    # model does not resolve (section 131). Highest in situ growth from
    # dilution experiments, 0.67 d-1 (Stelfox-Widdicombe et al. 2004,
    # southern North Sea, April, 7-9.5 C), minus microzooplankton grazing
    # (60 %, Calbet & Landry 2004) = 0.27 d-1 = 0.067 /tick = 97.8 /yr;
    # the zooplankton pair supplies 22.63 of it, so r_max = 75.2 /yr.
    # Sinking and lysis are not subtracted (would give ~0.055 /tick).
    # The annual-mean value of section 129 (0.0194, r_max 5.66) was a
    # steady-state remainder, the error already corrected for benthos.
    # Derivation: reports/Litteraturbaserad growth rate per FG.md.
    r_max: 75.2
    growth_rate: 0.0670068
    max_carrying_capacity: 24.0
    # 4.8 kJ/g WW, the Ecopath convention, for a flagellate-rich coastal
    # assemblage (flagellates 6-8 kJ/g WW). The previous 2.0 implies C/WW
    # ~0.04, i.e. large diatoms only, and left zooplankton unable to close
    # its energy budget (section 133, reports/Zooplankton energibudget.md).
    energy_content: 4800.0
    # seed_rate 0 is a DELIBERATE choice (2026-09-28), not editor drift:
    # phytoplankton has no recolonisation floor, so a cell that reaches
    # exact zero stays there. Sections 69.6 and 73.4 argue for 1e-07 and
    # 74.11 records the value being reset to 0 twice by the FG editor,
    # which rewrites this file without its comments. This block is
    # therefore the evidence that the zero was chosen: if it disappears,
    # the value came from the editor and not from a decision.
    seed_rate: 0.0
    # Light-limited growth on the daylight calendar (section 138): the
    # growth rate above is the April rate (section 131), so the factor is
    # 1 on day 105 and follows P-I = tanh(I/I_k) over the mixed layer
    # otherwise. I_k = Pmax/alpha, monthly medians of the SMHI 14C P-I
    # curves 2008-2021 (Anholt E, Kattegat, 0-10 m; Dec, n = 6, replaced
    # by the mean of Nov and Jan): photoacclimation from ~110 in winter
    # to ~300 in July.
    light_saturation: [114, 132, 161, 165, 208, 248, 298, 257, 193, 149, 111, 
          113]
    light_reference_day: 105
    spawn:
      mode: perlin
      scale: 12.0
      octaves: 4
      persistence: 0.5
      lacunarity: 2.0
      threshold: 0.0
      min_frac_of_max: 0.1
  zooplankton:
    display_name: "Zooplankton"
    is_decision_maker: true
    maintenance_level: 0.5
    max_energy_reserve: 675.0
    resting_metabolism: 22.5
    # Water temperature (section 143; only with the manifest's
    # simulation_settings.temperature): Q10 2.0 for active copepods and
    # krill, 4-16 C (Ikeda et al. 2001; Saborowski et al. 2000, Kattegat
    # Meganyctiphanes). resting_metabolism is read as the annual mean.
    # Calanus diapause (~10-20 % of active respiration) is a state switch
    # a Q10 does not describe.
    metabolism_q10: 2.0
    metabolism_t_ref: annual_mean
    movement_speed: 0.02
    # Respiration + excretion while feeding, in multiples of the resting
    # (fasting) rate (section 135): Kiorboe et al. 1985 measured both at
    # "more than 4 times" those of starved Acartia tonsa. The model has no
    # excretion term (ammonium, DOC), so that loss belongs here. Section
    # 124 used the respiration-only ratio, 1.6-2.5 (Thor 2000, Svetlichny
    # 2022, Koski 2017) -> 2.0. Cross-check, not the basis: the steady-
    # state gross growth efficiency is now ~0.29-0.31 (Straile 1997: mean
    # 0.26, IQR 0.13-0.35), against ~0.40 at 2.0. Kiorboe 2018's mf/m0 =
    # 6.7 also counts defecation, already in 1 - assimilation, so it is not
    # used as an upper bound.
    feeding_cost: 4.0
    movement_cost: 1.2
    energy_content: 4500.0
    min_split_biomass: 0.0
    # growth_rate is DERIVED by lib/world/growth_budget.py and recomputed
    # by the loader for every run; the number stored here is what the
    # loader computes for mareld2.yaml (seabirds muted) with
    # --mortality on; with --mortality off the loader leaves M1 out. Edit
    # r_max, natural_mortality or the predation matrix, not this value.
    # DM: g = (r_max + M1 + checked predation_mortality) /
    #         ((1 - maintenance_level) x 1460).
    # r_max 33.4 /yr = food-unlimited copepod production, 0.16 d-1 at
    # 11.5 C (Huntley & Lopez 1992) = 58.4 /yr, minus total mortality
    # 25 /yr. Replaces the unsourced 15-40 /yr band of section 111.
    r_max: 33.4
    growth_rate: 0.127933
    # M1 = total copepod mortality (~25 /yr = realised P/B) minus the
    # 21 % taken by pelagic fish, gadoids and seabirds in the North Sea
    # Ecopath diet matrix: 19.7 /yr. The rest is carnivorous zooplankton,
    # fish larvae, jellyfish and non-predation losses. Was 0.0025.
    natural_mortality: 0.0134
    max_intake_rate: 0.25
    spawn:
      mode: env_driven
      floor: 0.0
      noise_amp: 0.0
      noise_scale: 4.0
      min_frac_of_max: 0.1
      refs:
        - name: phytoplankton
          weight: 1.0
          transform: linear
    starve_rate: 0.2
    visibility_floor: 0.2
    interference: 0.0
    extinction_threshold_factor: 0.5
    current_response: 1.0
  benthic_community:
    current_response: 0.0
    display_name: "Benthic Community"
    is_decision_maker: false
    movement_speed: 0.0
    # Hand-set growth_rate (section 136: no r_max, so it is NOT derived
    # from the predation matrix), K = 10 t/km2 (user's value). r is the
    # community-biomass recovery rate after trawling, 0.82 /yr (5-95 %
    # 0.42-1.53; Hiddink et al. 2017 PNAS; Pitcher et al. 2022: 0.68 on
    # mud): 0.82 / 1460 per tick (section 161.13). Was 0.001 (1.46 /yr),
    # which halved the depletion bottom trawling causes at a given SAR.
    # K ~100 from reports/Litteraturbaserad growth rate per FG.md is not
    # adopted.
    growth_rate: 0.000561644
    max_carrying_capacity: 10.0
    energy_content: 3000.0
    spawn:
      mode: perlin
      scale: 18.0
      octaves: 3
      persistence: 0.5
      lacunarity: 2.0
      threshold: 0.0
      min_frac_of_max: 0.0
    seed_rate: 1e-06
  pelagic_fish:
    display_name: "Pelagic Fish"
    is_decision_maker: true
    # Lean body + fat reserve (section 140). energy_content is the LEAN
    # tissue, ~4.1 kJ/g from 15-19 % protein (Warren et al. 2026); the
    # reserve is the fat, up to ~18 % (0.396 kJ/g per fat %), so a full
    # herring holds ~11 kJ/g, the North Sea Q3 value of 10.1-11.9
    # (Pedersen & Hislop 2001 via JNCC Report 633). Starvation mortality
    # starts at 0.2 of the reserve (~2 % fat, the spring low of healthy
    # Baltic herring, Rojbek et al. 2014), not at half of it: herring
    # live through the winter on their fat. Predators eat the reserve
    # with the fish (prey_includes_reserve); at the reference fill 0.5
    # the static quality is 4000 + 0.5 x 7000 = 7500 MJ/t, the annual
    # mean that section 98 settled on for the porpoise diet gate.
    maintenance_level: 0.2
    max_energy_reserve: 7000.0
    resting_metabolism: 8.0
    # Water temperature (section 143; only with the manifest's
    # simulation_settings.temperature): Q10 2.2 from sprat respirometry,
    # 9-21 C (Meskendahl 2013; clupeids 1.8-2.2). t_ref 14 C because 8
    # MJ/t/tick (32 kJ/kg/d at rest) is the Rudstam/Rose et al. 2008
    # herring resting term at ~14 C, i.e. already a summer value: the
    # multiplier is ~0.5 in Jan-Apr and ~1 in Aug-Sep.
    metabolism_q10: 2.2
    metabolism_t_ref: 14.0
    movement_speed: 1.0
    feeding_cost: 1.9
    movement_cost: 1.5
    energy_content: 4000.0
    prey_includes_reserve: true
    reserve_reference_fill: 0.5
    min_split_biomass: 0.5
    # growth_rate is DERIVED by lib/world/growth_budget.py and recomputed
    # by the loader for every run; the number stored here is what the
    # loader computes for mareld2.yaml (seabirds muted) with
    # --mortality on; with --mortality off the loader leaves M1 out. Edit
    # r_max, natural_mortality or the predation matrix, not this value.
    # r_max 0.648 /yr: biomass-weighted FishBase CMSY priors over herring,
    # sprat, mackerel, horse mackerel, sandeel and other planktivores.
    r_max: 0.648
    growth_rate: 0.00160628
    # M1 = M0 (0.391) + predation by groups that are not FGs (0.189:
    # sharks, rays, other fish, larvae) = 0.580 /yr, North Sea Ecopath
    # 1991. Predation by FGs lives in predation_mortality. Was 1.0e-04.
    natural_mortality: 0.000397
    max_intake_rate: 0.04
    spawn:
      mode: colony
      n_colonies: 25
      sigma_cells: 1.0
      anchor: free
      amplitude_mode: jitter
      amplitude_min: 0.0
      amplitude_max: 1.0
    starve_rate: 0.025
    visibility_floor: 0.35
    # Beddington-DeAngelis w (section 162; was 0.7, set in section 86
    # against the band artefact, not from herring data). No behavioural
    # interference has been measured in herring; per-capita intake falls
    # 0-5 % per doubling of stock density, depletion included (Stenevik
    # et al. 2022, Brunel & Dickey-Collas 2010), and school-scale costs
    # are offset by facilitation. 0.7 cut winter intake by two thirds at
    # 3.4 t/km2 (40 % per doubling). 0.05 = the compromise of
    # research_notes/Sillens vinterfoda/herring_interference.md.
    interference: 0.05
    extinction_threshold_factor: 0.5
  gadoids:
    display_name: "Gadoids"
    is_decision_maker: true
    maintenance_level: 0.5
    max_energy_reserve: 2500.0
    resting_metabolism: 6.0
    # Water temperature (section 143; only with the manifest's
    # simulation_settings.temperature): Q10 2.2 from cod standard
    # metabolic rate, 35.5 / 57.0 / 78.2 mg O2/kg/h at 5 / 10 / 15 C
    # (Schurmann & Steffensen 1997). resting_metabolism is read as the
    # annual mean (low confidence).
    metabolism_q10: 2.2
    metabolism_t_ref: annual_mean
    movement_speed: 0.25
    feeding_cost: 1.75
    movement_cost: 2.0
    energy_content: 5500.0
    min_split_biomass: 0.5
    # growth_rate is DERIVED by lib/world/growth_budget.py and recomputed
    # by the loader for every run; the number stored here is what the
    # loader computes for mareld2.yaml (seabirds muted) with
    # --mortality on; with --mortality off the loader leaves M1 out. Edit
    # r_max, natural_mortality or the predation matrix, not this value.
    # r_max 0.511 /yr: biomass-weighted FishBase CMSY priors over cod,
    # whiting, haddock, saithe, hake and the other gadoids (Norway pout
    # and blue whiting excluded: they eat zooplankton).
    r_max: 0.511
    growth_rate: 0.00357051
    # M1 = M0 (0.20; SMS residual M1 convention for cod, haddock,
    # whiting and saithe; Ecopath NS 1991 adults 0.18) + predation by
    # non-FG groups (0.214; squid, halibut, gurnards, long-rough dab,
    # megrim, rays, monkfish) = 0.41 /yr. The Ecopath pool residual
    # 0.392 is not used: 66 % of it is juvenile haddock and saithe with
    # EE 0.45 / 0.31. No benthos part: the crab / Nephrops / shrimp
    # entries on 'other gadoids' in Mackinson & Daskalov 2007 Table 3.4
    # duplicate the megrim / halibut / large demersal columns (column
    # sums). reports/Restdödlighet M0 hos torskfiskar.md, resume 157.
    # Cannibalism is the gadoids_preys_on_gadoids pair (unchecked since
    # section 160, so it is in neither M1 nor the budget). Was 0.000468
    # (0.683 /yr), before that 7.0e-05.
    natural_mortality: 0.000284
    max_intake_rate: 0.04
    spawn:
      mode: colony
      n_colonies: 25
      sigma_cells: 1.0
      anchor: free
      amplitude_mode: jitter
      amplitude_min: 0.0
      amplitude_max: 1.0
    starve_rate: 0.012
    visibility_floor: 0.6
    interference: 1.0
    extinction_threshold_factor: 0.5
  porpoises:
    display_name: "Porpoises"
    is_decision_maker: true
    maintenance_level: 0.5
    max_energy_reserve: 2800.0
    # Section 145: resting_metabolism is REST (no foraging, no travel),
    # not field metabolic rate. 60 MJ/t/tick = 0.24 MJ/kg/day, near the
    # lab rate of two 28 kg juveniles (Reed et al. 2000: 247 ml O2/min,
    # 1.9x Kleiber). The 90 of 2026-06-01 put FMR into rest and then
    # charged eat and move on top of it.
    resting_metabolism: 60.0
    # No metabolism_q10 (section 143): an endotherm; wild field metabolic
    # rate is flat over 0-20 C water and FMR barely changed between Dec,
    # Aug and Feb (Rojano-Donate et al. 2018).
    movement_speed: 1.0
    # Eat = the measured FMR of wild porpoises, which forage day and
    # night, so it includes hunting and the heat increment of feeding:
    # 60 * 1.5 = 90 MJ/t/tick = 0.36 MJ/kg/day vs 0.35 for wild adults
    # (Rojano-Donate et al. 2018: 21.7 MJ/day = 12.1 ml O2/kg/min; up to
    # +30 % if each breath is underestimated). Break-even ration on
    # clupeids 90 / 6750 = 0.0133 t/t/tick = 5.3 % of body mass per day
    # (Kastelein 4-9.5 %).
    feeding_cost: 1.5
    # Move = swimming without hunting or digestion, so below eat: most of
    # FMR is already locomotion (min cost of transport 2.4 J/kg/m at
    # 1.3-1.5 m/s, Otani et al. 2001) and a move tick has no intake. No
    # porpoise measurement separates travel from foraging; 1.3 is a
    # judgement between rest and eat.
    movement_cost: 1.3
    # Indivisible unit = one porpoise (~50-60 kg; Rojano-Donate et al.
    # 2018 imply ~62 kg). Cells below it take one action per tick. 250 kg
    # (2026-09-14, a proxy for coherent movement, section 71.11) made
    # every porpoise cell one-hot, so the argmax hid a ~25 % move
    # probability and a moving cell gave up a whole tick of food; on
    # frozen fix53 policies 50 kg ended the year at 4.5 t vs 2.9 t
    # (section 152). Also sets the spawn floor (5x = 250 kg per cell).
    min_split_biomass: 50.0
    energy_content: 8500.0
    # growth_rate is DERIVED by lib/world/growth_budget.py and recomputed
    # by the loader for every run; the number stored here is what the
    # loader computes for mareld2.yaml (seabirds muted) with
    # --mortality on; with --mortality off the loader leaves M1 out. Edit
    # r_max, natural_mortality or the predation matrix, not this value.
    # r_max 0.10 /yr (Lockyer 2003; Caswell et al. 1998; Forney et al.
    # 2021: 9.6 %/yr after bycatch ended).
    r_max: 0.10
    growth_rate: 0.000447389
    # M = M1 = 0.10 /yr, biomass weighted (Leslie models from adult
    # survival 0.90-0.95 excluding bycatch, plus calf mortality). No FG
    # preys on porpoises. Was 6.0e-05.
    natural_mortality: 6.85e-05
    # Physiological intake ceiling, NOT the realised ration: 0.035 t prey
    # per t predator per tick = 14 % of body mass per day. Kastelein et
    # al. measure 4-9.5 %/day for captive harbour porpoises, so the cap
    # sits ~1.5x above the highest observed ration, which is what a
    # ceiling is supposed to do. The previous 0.05 (20 %/day) was 2x the
    # observed maximum and the un-anchored (since removed) satiation_scale was silently
    # doing the ceiling's job of setting the ration (Section 92).
    max_intake_rate: 0.035
    spawn:
      mode: env_driven
      floor: 0.0
      noise_amp: 0.0
      noise_scale: 4.0
      min_frac_of_max: 0.0
      refs:
        - name: pelagic_fish
          weight: 1.0
          transform: linear
    starve_rate: 0.5
    visibility_floor: 0.0
    # Left at 0: porpoises never reach densities where interference
    # matters (they occupy a handful of cells at <1 ton each) and are
    # already the group most at risk of extinction. Section 86.
    interference: 0.0
    # Sweep at 0.1 * 50 kg = 5 kg per cell, as before section 152.
    extinction_threshold_factor: 0.1
  seals:
    # Harbour seals only (section 166): grey seals are a few individuals
    # in Swedish Skagerrak (HaV 2025; Carroll et al. 2025) and too large
    # for the one-seal unit below.
    display_name: "Seals"
    is_decision_maker: true
    maintenance_level: 0.5
    # ~14 % of body mass as blubber; adults swing ~4000-4200 MJ/t over the
    # year (Olesiuk 1993; Karpovich).
    max_energy_reserve: 5200.0
    # REST, as for porpoises (section 145): 50 MJ/t/tick = 0.20 MJ/kg/day,
    # 1.9x Kleiber at the 55 kg population mean; captive adults resting
    # after a meal 45-52 (Paterson et al. 2021). Was 45. No metabolism_q10:
    # thermoneutral in 6-17 C water (Olesiuk 1993).
    resting_metabolism: 50.0
    movement_speed: 1.0
    # Eat = field metabolic rate incl. the heat increment of feeding
    # (10-17 % of gross intake, ~15 h; Markussen 1994), above move =
    # transit swimming (~2.2x rest at 1.4 m/s, Davis 1985 / Williams 1987
    # via Olesiuk 1993). The porpoise order; was eat 1.3 / move 1.5.
    feeding_cost: 1.5
    movement_cost: 1.3
    # Indivisible unit = one seal of the population mean mass: 0-3 year
    # olds are ~half the population, so ~55 kg (Olesiuk 44.7, Haerkoenen &
    # Heide-Joergensen 41.8 for younger, growing populations). Was 80 kg,
    # an adult.
    min_split_biomass: 55.0
    # Lean value, as for pelagic_fish (whole body ~15.9 MJ/kg at 30 %
    # blubber, Olesiuk 1993). prey_includes_reserve is not set because
    # nothing eats seals; set it if a seal predator is added.
    energy_content: 10000.0
    # growth_rate is DERIVED by lib/world/growth_budget.py and recomputed
    # by the loader for every run; the number stored here is what the
    # loader computes for mareld2.yaml (seabirds muted) with
    # --mortality on; with --mortality off the loader leaves M1 out. Edit
    # r_max, natural_mortality or the predation matrix, not this value.
    # r_max 0.11 /yr: harbour seal 10.2-13.6 %/yr in Kattegat-Skagerrak
    # after 1988 (Carroll et al. 2025), grey seal <= 10 % (HELCOM).
    r_max: 0.11
    growth_rate: 0.000486383
    # M = M1 = 0.10 /yr, biomass weighted (Leslie models); no FG preys on
    # seals. Was 6.0e-05.
    natural_mortality: 6.85e-05
    # Fallback attack rate; both seal pairs set their own (section 166).
    max_intake_rate: 0.05
    # Spawn on the main prey, as porpoises spawn on herring (user's call,
    # section 166). The 7 free colonies started with ~no gadoid overlap.
    spawn:
      mode: env_driven
      floor: 0.0
      noise_amp: 0.0
      noise_scale: 4.0
      min_frac_of_max: 0.0
      refs:
        - name: gadoids
          weight: 1.0
          transform: linear
    # 1.5 % of biomass per tick at an empty reserve: blubber lets a seal
    # fast for weeks (30-60 day target, section 147).
    starve_rate: 0.03
    visibility_floor: 0.0
    # Sweep at 0.1 * 55 kg = 5.5 kg per cell, as for porpoises (section
    # 152); the default 0.5 cleared cells below 40 kg.
    extinction_threshold_factor: 0.1
    interference: 0.0
  seabirds:
    display_name: "Seabirds"
    is_decision_maker: true
    max_energy_reserve: 3400.0
    resting_metabolism: 135.0
    movement_speed: 1.0
    feeding_cost: 2.2
    movement_cost: 2.8
    min_split_biomass: 1.0
    maintenance_level: 0.5
    energy_content: 7000.0
    # growth_rate is DERIVED by lib/world/growth_budget.py and recomputed
    # by the loader for every run; the number stored here is what the
    # loader computes for mareld2.yaml (seabirds muted) with
    # --mortality on; with --mortality off the loader leaves M1 out. Edit
    # r_max, natural_mortality or the predation matrix, not this value.
    # r_max 0.10 /yr: Niel & Lebreton on JNCC 552 rates (guillemot 0.08,
    # razorbill/gannet 0.10, kittiwake/gulls 0.11-0.16).
    r_max: 0.10
    growth_rate: 0.000466172
    # M = M1 = 0.15 /yr, biomass weighted with juveniles (Leslie Z:
    # guillemot 0.145, kittiwake 0.16, gannet 0.20); no FG preys on
    # seabirds. Was 8.0e-05 (adult-only 0.117 /yr).
    natural_mortality: 0.0001027
    max_intake_rate: 0.15
    spawn:
      mode: colony
      n_colonies: 4
      sigma_cells: 2.0
      anchor: free
      amplitude_mode: uniform
      amplitude_min: 0.0
      amplitude_max: 1.0
    starve_rate: 0.2
    visibility_floor: 0.0
interaction_definitions:
  # predation_mortality (per pair, 1/yr): the literature predation
  # mortality of the column FG caused by the row FG (North Sea Ecopath
  # 1991, Mackinson & Daskalov 2007, every species under the umbrella
  # terms; phytoplankton: 20 % of 0.31 d-1). While the pair is checked
  # (preys_on) and the predator is active, it is added to the prey's
  # growth_rate (lib/world/growth_budget.py); unchecking removes it.
  # It is a budget entry, not the realised predation of the tick.
  # zooplankton -> phytoplankton, Holling II f(B) = a B / (1 + a h B):
  # the ceiling 1/h = 0.25 t/t/tick (= zooplankton max_intake_rate,
  # 100 % WW/day, 0.44 body energy/day) is unchanged; the pair-level
  # attack rate a = 0.0125 sets the half-saturation 1/(a h) = 20 t/km2
  # (section 134). Copepod literature puts it at ~5-60 g WW/m2 for a
  # 10-20 m feeding layer; the old a = 0.25 (h = 1/a convention) gave
  # 1 t/km2, so zooplankton fed at the ceiling at almost any phyto
  # density and grazed it down to 0.5-0.8 t/cell
  # (reports/Zooplankton energibudget.md).
  zooplankton_preys_on_phytoplankton:
    handling_time: 4.0
    preys_on: true
    max_intake_rate: 0.0125
    predation_mortality: 22.63
    assimilation_factor: 0.65
  pelagic_fish_preys_on_zooplankton:
    preys_on: true
    predation_mortality: 5.24
    assimilation_factor: 0.8
    handling_time: 25.0
    # Daylight calendar (section 137; only active when the project
    # enables simulation_settings.daylight). Herring bite zooplankton
    # by sight down to 0.001 lx (Batty, Blaxter & Richard 1990); their
    # stomach fullness peaks after dawn and before dusk, and at night
    # they switch to filter feeding (Darbyson et al. 2003). dark_ratio
    # 0.1 (night attack rate a tenth of the daylight one) is an estimate
    # consistent with that, not a measured ratio. 0.001 lx at the
    # 10-40 m the herring feed at is ~0.005-0.4 lx at the surface
    # (Kd ~0.15/m), i.e. a sun 8-12 deg below the horizon; -8 deg is
    # the half-detection point of the logistic.
    dark_ratio: 0.1
    light_threshold_deg: -8.0
    # Section 162. Hiding zooplankton still visible to herring: was 0.2,
    # a deep-basin refuge. On a ~100 m bank the 0.001 lx biting
    # threshold reaches the bottom at midday in December and June (Kd
    # 0.15/m), shelf-sea copepods mostly do not migrate (Daro 1988,
    # Irigoien et al. 2004) and a non-feeding copepod is still visible;
    # the literature-implied daytime accessible share is 0.65-0.9 in
    # summer and 0.5-0.8 in winter, against ~0.3 with 0.2 and the
    # trained 80-95 % rest. 0.5 = mid of the 0.4-0.6 band in
    # research_notes/Sillens vinterfoda/zooplankton_refuge.md.
    visibility_floor: 0.5
    # Type II, not the specialist default Type III (section 162): every
    # fit to herring is Type II or linear (Bernreuther 2007 lab,
    # Arrhenius & Hansson 1999 field; NEMURO.FISH, mizer), no sigmoid
    # response is reported for any clupeid, and with one prey there is
    # nothing to switch to, so Type III only cut winter intake.
    functional_response: 2
  gadoids_preys_on_pelagic_fish:
    preys_on: true
    predation_mortality: 0.2997
    assimilation_factor: 0.8
    # Gadoid Holling ceilings are an ENERGY limit (sections 147, 148):
    # h = 130 * E_prey / 4500, E_prey the energy as eaten (MJ/t), so
    # every gadoid pair fills the stomach at the same ~35 MJ/t/tick
    # (~3 % body mass/day of 4.5 kJ/g food; adult cod Cmax ~2-3.5 %/day
    # at North Sea temperatures, Jobling 1988 read as kJ/day; lab
    # rations 1.9-2.5 % at 4-6 C, ICES CM 1980/F20). Gastric evacuation
    # slows in proportion to prey energy density (whiting, Andersen
    # 1999; cod, Temming & Herrmann 2003). A mass limit made herring
    # worth ~3x benthos per stomach-full: gadoids ate <3 % benthos
    # (Ecopath ~28 % of the model's prey). Herring here: 7500 MJ/t at
    # the reserve reference fill -> h 217. h was 25 (16 %/day) before
    # section 147. a stays 0.04 on every pair.
    handling_time: 217.0
    visibility_floor: 0.25
    # Type III (section 141): gadoids are generalists that switch to
    # other prey when herring get scarce, giving herring a refuge at low
    # density. Without it herring went extinct within two years in every
    # run; with it alone they were held at ~3 % of spawn.
    functional_response: 3
    # Daylight calendar (section 137; only with simulation_settings.
    # daylight). Gadoids catch clupeids mostly at dusk and dawn but keep
    # feeding at night by lateral line and smell: cod stomachs with
    # herring peak morning and evening (Adlerstein & Welleman 2000),
    # gadoids take sprat at night in a Norwegian fjord (Kaartvedt et al.
    # 2009), whiting feed mainly at night (Mergardt & Temming 1997).
    # dark_ratio 0.6 (range 0.4-1.0) is inferred from stomach data, not
    # measured. Threshold -5 deg: half detection at ~0.01-0.03 lx at
    # 30-40 m with an effective Kd 0.15-0.2 /m (cod reactive distance
    # still long at ~0.35-1.5 lx, Meager et al. 2010). Monthly mean
    # multiplier 0.88 in Dec, 1.13 in Jun (annual mean 1). Source:
    # reports/Torskfiskars ljusberoende vid jakt.md.
    dark_ratio: 0.6
    light_threshold_deg: -5.0
  porpoises_preys_on_pelagic_fish:
    preys_on: true
    predation_mortality: 0.0117
    # Porpoise attack rates are fitted to the Ecopath 1991 diet, not to a
    # mechanism (section 151): ~49 % gadoids by mass on the model's prey
    # (M2 0.0557 vs 0.0117 /yr, 4.8x more per tonne of gadoids). With the
    # species a 0.035 on both pairs, herring gave 181 MJ/t/tick at full
    # appetite where porpoises were (fix51), more than gadoids give at
    # the mass ceiling (4620 / 28.6 = 162), so porpoises ate 0 %
    # gadoids; no gadoid a alone reaches the target. a 0.015 here and
    # 0.2 on gadoids give 26 % gadoids where porpoises were and 46 %
    # over every cell (frozen fields, so the learned shift lies in
    # between), with 137 MJ/t/tick against a cost of ~90 (1.5x, was 2x;
    # wild porpoises forage almost continuously, Wisniewska et al. 2016).
    max_intake_rate: 0.015
    assimilation_factor: 0.9
    # Mass ceiling 1/h kept (marine mammal intake is mass-limited, Rosen
    # & Trites 2000; section 149). a*h is 0.43 since section 151, so the
    # half-saturation is 1/(a h) = 2.3 t/km2 visible herring.
    handling_time: 28.6
    # Porpoises hunt with biosonar, so the visual crypsis that makes
    # hidden herring only 35 % detectable by default does not apply:
    # schooling behaviour is no defence against echolocation
    # (Au 1993; Verfuss et al. 2009). Floor 0.95 = hiding gives herring
    # almost no protection against this predator; the break-even
    # requirement is 5.25 t visible / ~5.6 t total per cell, down from
    # 15.1 t/cell at the herring species default 0.35
    # (Sections 71.12, 74.2).
    visibility_floor: 0.95
  seals_preys_on_gadoids:
    preys_on: true
    # Gadoids carry ~95 % of the seal diet by mass: Skagerrak seals eat
    # mostly flatfish (46 % of energy, GU 2019 scats), haddock, pollack,
    # saithe and Norway pout (Soerlie et al. 2020: gadoids + flatfish 87 %
    # of biomass; Kappa et al. 2026), and the model has no flatfish group.
    # 15 t of seals at ~5.9 % of body mass per day (own budget; Olesiuk
    # 1993: 5.0 %) eat ~325 t/yr, ~309 t/yr of it gadoids = 0.12 /yr of
    # the 2500 t start biomass (section 166; range 0.08-0.18). Was 0.0299.
    predation_mortality: 0.12
    # Attack rate as for porpoises -> gadoids (section 151): at the
    # FG fallback 0.05 the break-even visible gadoid density (0.55 t/km2)
    # sat at the grid mean (0.69). Starting value; tune toward a 95:5
    # diet. Default response type (II, two prey): III on the prey that
    # is nearly the whole diet mainly cuts intake (section 162).
    max_intake_rate: 0.2
    # Metabolisable energy (Lawson et al. 1997; Keiver et al. 1984); the
    # heat increment is paid in feeding_cost. Was 0.86.
    assimilation_factor: 0.85
    # Ceiling 1/26 = 15 % of body mass per day = 0.85 MJ/kg/day, 1.5x the
    # highest routine intake found (0.57 MJ/kg/day, spotted seal
    # yearlings, Rosen et al. 2021), the porpoise rule. Was 20 (20 %/day).
    handling_time: 26.0
    # Harbour seals find resting bottom fish with their vibrissae:
    # blindfolded seals locate flatfish breathing currents of ~4 cm/s
    # (Niesterok et al. 2017, JEB 220:174 and 220:2364) and follow fish
