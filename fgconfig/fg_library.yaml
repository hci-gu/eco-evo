  seals_preys_on_pelagic_fish:
    preys_on: true
    # Herring ~5 % of the diet by mass (2.8 % of energy in 2019 scats, GU;
    # 10 % by Qi in Soerlie et al. 2020; down from ~24 % historically):
    # ~16 t/yr of 12000 t (section 166). Was 0.0076.
    predation_mortality: 0.0015
    # Fitted to the diet target, not measured (as the porpoise rates,
    # section 151). Mechanism: harbour seals forage on the bottom with
    # their vibrissae, herring school in the water column; the model has
    # one layer per cell, so a low a stands in for the missing vertical
    # habitat separation. Type III attack rate, per (t/cell)^2: the
    # effective Type II rate is a * B. The first value, 0.015, was the
    # porpoise Type II rate in the wrong units; at the 6-7 t/cell of
    # visible herring the seals stood on it gave a * B ~ 0.1, and fat
    # herring (~8000 MJ/t) beat gadoids in ~80 % of the seals' cells:
    # fix60 seals ate 84-88 % herring by mass (section 168). 1e-4 puts the
    # half-saturation 1/sqrt(a h) at 17 t/cell; on the fix60 prey fields a
    # seal eating the better prey in its cell takes ~4 % herring by mass
    # (3e-4: ~19 %). Range 1e-4 - 2e-4 for 3-10 % herring; retune against
    # the retrained diet (tools/probes/pair_intake.py). Weak points: the
    # per-tonne selectivity (1/120 - 1/670 of the gadoid rate at 17-3
    # t/cell) is stronger than the empirical ~1/90, and the fit used
    # fix60's policy-shaped fields and a greedy seal.
    # Section 185.10: 1e-4 -> 2e-4. The target is the whole pelagic_fish
    # pool (herring, sprat, sandeel, ...), ~10 % of the diet by mass
    # (5-20 %). fix68's trained seals took 0.001 %. On the current
    # world (gadoids held near 0.65 t/km2 by K, pelagic pool ~6-7) a
    # greedy seal takes 6 % at 1e-4, 18-20 % at 2e-4, 30-36 % at 3e-4;
    # a trained policy picks less pelagic fish than greedy, so the top
    # of the range. Retune against the retrained diet: > 20 % -> 1.5e-4,
    # < 5 % -> 3e-4.
    # Section 185.16: 2e-4 -> 3e-4. Eat intake is linear in the eat
    # share, so a seal maximising energy puts the whole eat mass on
    # the better prey of each cell; the water-filling greedy arm above
    # mixes prey the way that optimiser never does. A seal with the
    # trained positions eating the better prey per cell takes 9.3 %
    # pelagic fish by mass at 3e-4 (12.6 % of energy; 2 seeds x 2
    # years), 5.4 % at 2e-4, 14 % at 4e-4. The seals' biomass barely
    # moves with the switch, so a trained policy may still eat less.
    # Section 199.9: 3e-4 -> 2e-3. The 185.16 optimiser rated the pool on
    # its TOTAL biomass; the engine feeds on the visible part (herring
    # rest ~38 %, squared under Type III), and fix69's pool was 4-7
    # t/km2 against ~3 since its K. With the engine's own effective rate
    # (visible prey, interference) an optimising seal on fix70 positions
    # takes 0.02-0.3 % pelagic fish at 3e-4 - nothing to learn - and
    # 3.9-8.5 % by mass at 2e-3 (2 seeds, 1 training-length year).
    max_intake_rate: 0.002
    # Metabolisable energy 85.5-88.7 % on herring (Keiver et al. 1984);
    # 0.92 was a digestibility. Was 0.92.
    assimilation_factor: 0.88
    # Same energy ceiling as the gadoid pair: 0.88 * ~7500 / 35 = 189 vs
    # 0.85 * 5500 / 26 = 180 MJ/t/tick, ~11 % of body mass per day. Was 20.
    handling_time: 35.0
    # Pinnipeds switch prey (Smout et al. 2014; Middlemas et al. 2006):
    # Type III gives herring a refuge when the seals switch away.
    functional_response: 3
