project_metadata:
  name: Mareld2
  reference_grid_width: 60
  reference_grid_height: 60
simulation_settings: {}
decision_makers:
  - group_id: gadoids
    initial_biomass_min: 1250
    initial_biomass_max: 5000
    inference_initial_biomass: 5000
  - group_id: pelagic_fish
    initial_biomass_min: 6000
    initial_biomass_max: 24000
    inference_initial_biomass: 24000
  - group_id: porpoises
    initial_biomass_min: 1
    initial_biomass_max: 120
    inference_initial_biomass: 40
  - group_id: seabirds
    initial_biomass_min: 12
    initial_biomass_max: 50
    inference_initial_biomass: 25
  - group_id: seals
    initial_biomass_min: 5
    initial_biomass_max: 30
    inference_initial_biomass: 15
  - group_id: zooplankton
    initial_biomass_min: 10000
    initial_biomass_max: 30000
    inference_initial_biomass: 25000
non_decision_makers:
  - group_id: benthic_community
    initial_biomass_min: 0
    initial_biomass_max: 320000
    inference_initial_biomass: 16000
    muted: true
  - group_id: phytoplankton
    initial_biomass_min: 40000
    initial_biomass_max: 100000
    inference_initial_biomass: 80000
impact_variables:
  - impact_id: pelagic_trawling
    value_min: 0.0
    value_max: 1000.0
    spawn:
      mode: perlin
      scale: 12.0
      octaves: 4
      persistence: 0.5
      lacunarity: 2.0
      threshold: 0.0
  - impact_id: rotor
    value_min: 0
    value_max: 1
  - impact_id: windfarm_noise
    value_min: 0.0
    value_max: 140.0
    observable: true
    spawn:
      mode: colony
      n_colonies: 5
      sigma_cells: 8.0
      anchor: free
      amplitude_mode: jitter
      amplitude_min: 0.3
      amplitude_max: 1.0
inference:
  impact_maps:
    rotor: vindparker.npz
