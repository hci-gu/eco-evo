project_metadata:
  name: Mareld2
  reference_grid_width: 60
  reference_grid_height: 60
simulation_settings:
  daylight:
    enabled: true
    latitude_deg: 58.15
    start_day_of_year: random
    light_attenuation_per_m: 0.29
    mixed_layer_depth_m:
      - 13.0
      - 9.0
      - 6.0
      - 6.0
      - 6.0
      - 6.0
      - 6.0
      - 7.0
      - 10.0
      - 10.0
      - 17.0
      - 15.0
    cloud_transmission:
      - 0.66
      - 0.66
      - 0.73
      - 0.78
      - 0.75
      - 0.74
      - 0.74
      - 0.73
      - 0.7
      - 0.66
      - 0.6
      - 0.69
decision_makers:
  - group_id: gadoids
    initial_biomass_min: 1250
    initial_biomass_max: 5000
    inference_initial_biomass: 2500
  - group_id: pelagic_fish
    initial_biomass_min: 6000
    initial_biomass_max: 24000
    inference_initial_biomass: 12000
  - group_id: porpoises
    initial_biomass_min: 6
    initial_biomass_max: 18
    inference_initial_biomass: 12
  - group_id: seabirds
    initial_biomass_min: 12
    initial_biomass_max: 50
    inference_initial_biomass: 25
    muted: true
  - group_id: seals
    initial_biomass_min: 5
    initial_biomass_max: 30
    inference_initial_biomass: 15
    muted: true
  - group_id: zooplankton
    initial_biomass_min: 17500
    initial_biomass_max: 70000
    inference_initial_biomass: 35000
non_decision_makers:
  - group_id: benthic_community
    initial_biomass_min: 12000
    initial_biomass_max: 20000
    inference_initial_biomass: 16000
  - group_id: phytoplankton
    initial_biomass_min: 40000
    initial_biomass_max: 100000
    inference_initial_biomass: 80000
impact_variables:
  - impact_id: pelagic_trawling
    value_min: 0.0
    value_max: 1000.0
    spawn:
      mode: perlin
      scale: 12.0
      octaves: 4
      persistence: 0.5
      lacunarity: 2.0
      threshold: 0.0
    muted: true
  - impact_id: rotor
    value_min: 0
    value_max: 1
    muted: true
  - impact_id: windfarm_noise
    value_min: 0.0
    value_max: 140.0
    observable: true
    spawn:
      mode: colony
      n_colonies: 5
      sigma_cells: 8.0
      anchor: free
      amplitude_mode: jitter
      amplitude_min: 0.3
      amplitude_max: 1.0
    muted: true
spawn_templates:
  colony:
    25Colonies:
      n_colonies: 25
      sigma_cells: 1.0
      anchor: free
      amplitude_mode: jitter
      amplitude_min: 0.0
      amplitude_max: 1.0
  perlin:
    Perlin12:
      scale: 12.0
      octaves: 4
      persistence: 0.5
      lacunarity: 2.0
      threshold: 0.0
      min_frac_of_max: 0.1
  uniform:
    Uniform: {}
  env_driven:
    FollowPhyto:
      floor: 0.0
      noise_amp: 0.0
      noise_scale: 4.0
      min_frac_of_max: 0.1
      refs:
        - name: phytoplankton
          weight: 1.0
          transform: linear
    Followfish:
      floor: 0.0
      noise_amp: 0.0
      noise_scale: 4.0
      min_frac_of_max: 0.0
      refs:
        - name: pelagic_fish
          weight: 1.0
          transform: linear
inference:
  impact_maps:
    rotor: vindparker.npz
